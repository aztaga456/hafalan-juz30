      }
      // Default: alafasy ('05')
      return ayah.audioMap?.["05"] || ayah.audio || `https://everyayah.com/data/Alafasy_128kbps/${surahPad}${ayahPad}.mp3`;
    };

    function SurahDetail({ surahInfo, surahCache, setSurahCache, progress, updateProgress, updateMultipleProgress, targetRange, onBack, showToast, onSelectSurah }) {
      const [showSettings, setShowSettings] = useState(false);
      const [showEval, setShowEval] = useState(false);
      const [fullSurah, setFullSurah] = useState(surahCache[surahInfo.id]);
      const [isLoading, setIsLoading] = useState(!surahCache[surahInfo.id]);

      const [selectedQari, setSelectedQari] = useState(() => {
        return localStorage.getItem('juz30_selected_qari') || 'alafasy';
      });
      const selectedQariRef = useRef(selectedQari);

      const [isUmmiPlaying, setIsUmmiPlaying] = useState(false);
      const ummiAudioRef = useRef(null);

      const hasUmmiAudio = Boolean(UMMI_AUDIO_MAP[surahInfo.id]);

      useEffect(() => {
        if (surahInfo) {
          try {
            const recent = JSON.parse(localStorage.getItem('juz30_recent_surahs') || '[]');
            const filtered = recent.filter(item => item.id !== surahInfo.id);
            const updated = [{ id: surahInfo.id, name: surahInfo.name, timestamp: Date.now() }, ...filtered].slice(0, 10);
            localStorage.setItem('juz30_recent_surahs', JSON.stringify(updated));
          } catch (e) {
            console.error("Gagal simpan histori surat dibuka:", e);
          }
        }
      }, [surahInfo?.id]);

      const [mode, setMode] = useState('surat');
      const [showLatin, setShowLatin] = useState(true);
      const [showArti, setShowArti] = useState(true);
      const [startAyah, setStartAyah] = useState(targetRange?.start || 1);
      const [endAyah, setEndAyah] = useState(targetRange?.end || surahInfo.ayahCount);

      const currentIndex = juz30SurahList.findIndex(s => s.id === surahInfo.id);
      const prevSurah = currentIndex > 0 ? juz30SurahList[currentIndex - 1] : null;
      const nextSurah = currentIndex < juz30SurahList.length - 1 ? juz30SurahList[currentIndex + 1] : null;
      const isFullSurah = (startAyah === 1 && endAyah === surahInfo.ayahCount);

      const renderSurahNavBottom = () => {
        if (!isFullSurah || !onSelectSurah) return null;
        return (
          <div className="mt-8 pt-4 pb-12 flex items-center justify-between gap-3 border-t border-slate-200">
            {prevSurah ? (
              <button
                type="button"
                id="btn-prev-surah"
                onClick={() => {
                  stopAudio();
                  stopUmmiAudio();
                  onSelectSurah(prevSurah.id, 1, prevSurah.ayahCount);
                  if (showToast) showToast(`Surat ${prevSurah.name}`);
                }}
                className="inline-flex items-center gap-2 px-4 py-2.5 rounded-2xl border-2 border-emerald-200 bg-white hover:bg-emerald-50 text-emerald-800 font-bold text-xs sm:text-sm shadow-xs transition active:scale-95"
              >
                <Icon name="arrowLeft" size={16} />
                <span>Surat {prevSurah.name}</span>
              </button>
            ) : <div />}

            {nextSurah ? (
              <button
                type="button"
                id="btn-next-surah"
                onClick={() => {
                  stopAudio();
                  stopUmmiAudio();
                  onSelectSurah(nextSurah.id, 1, nextSurah.ayahCount);
                  if (showToast) showToast(`Surat ${nextSurah.name}`);
                }}
                className="inline-flex items-center gap-2 px-4 py-2.5 rounded-2xl border-2 border-emerald-200 bg-white hover:bg-emerald-50 text-emerald-800 font-bold text-xs sm:text-sm shadow-xs transition active:scale-95 ml-auto"
              >
                <span>Surat {nextSurah.name}</span>
                <Icon name="arrowRight" size={16} />
              </button>
            ) : <div />}
          </div>
        );
      };

      const [playingAyah, setPlayingAyah] = useState(null);
      const [isSequencePlaying, setIsSequencePlaying] = useState(false);
      const [repeatLimit, setRepeatLimit] = useState(1);

      const audioRef = useRef(null);
      const sliceIntervalRef = useRef(null);
      const sequenceTimerRef = useRef(null);
      const activeAudioSrcRef = useRef(null);
      const ayahRefs = useRef({});
      const scrollContainerRef = useRef(null);

      const isSequencePlayingRef = useRef(false);
      const repeatLimitRef = useRef(1);
      const currentLoopRef = useRef(1);
      const targetRangeRef = useRef({ start: 1, end: surahInfo.ayahCount });

      useEffect(() => {
        targetRangeRef.current = { start: startAyah, end: endAyah };
      }, [startAyah, endAyah]);

      useEffect(() => {
        repeatLimitRef.current = repeatLimit;
      }, [repeatLimit]);

      useEffect(() => {
        if (surahCache[surahInfo.id]) {
          setFullSurah(surahCache[surahInfo.id]);
          setIsLoading(false);
          return;
        }

        const fetchSurah = async () => {
          try {
            setIsLoading(true);
            const res = await fetch(`https://equran.id/api/v2/surat/${surahInfo.id}`);
            const json = await res.json();
            if (json.code === 200) {
              const mapped = {
                ...surahInfo,
                ayahs: json.data.ayat.map(a => ({
                  number: a.nomorAyat,
                  text: a.teksArab,
                  latin: a.teksLatin,
                  translation: a.teksIndonesia,
                  audio: a.audio["05"] || Object.values(a.audio)[0],
                  audioMap: a.audio
                }))
              };
              setSurahCache(prev => ({ ...prev, [surahInfo.id]: mapped }));
              setFullSurah(mapped);
            }
          } catch (e) {
            console.error("Gagal mengunduh surat:", e);
          } finally {
            setIsLoading(false);
          }
        };

        fetchSurah();
      }, [surahInfo.id]);

      const filteredAyahs = useMemo(() => {
        if (!fullSurah) return [];
        return fullSurah.ayahs.filter(a => a.number >= startAyah && a.number <= endAyah);
      }, [fullSurah, startAyah, endAyah]);

      // Fungsi auto scroll ke ayat yang sedang diputar
      const scrollToAyah = (ayahNum) => {
        const el = ayahRefs.current[ayahNum];
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      };

      const stopAudio = () => {
        isSequencePlayingRef.current = false;
        setIsSequencePlaying(false);
        if (sequenceTimerRef.current) {
          clearTimeout(sequenceTimerRef.current);
          sequenceTimerRef.current = null;
        }
        if (sliceIntervalRef.current) {
          clearInterval(sliceIntervalRef.current);
          sliceIntervalRef.current = null;
        }
        if (audioRef.current) {
          audioRef.current.pause();
        }
        setPlayingAyah(null);
      };

      const stopUmmiAudio = () => {
        if (ummiAudioRef.current) {
          ummiAudioRef.current.pause();
          ummiAudioRef.current = null;
        }
        setIsUmmiPlaying(false);
      };

      const toggleUmmiAudio = () => {
        if (isUmmiPlaying) {
          stopUmmiAudio();
        } else {
          stopAudio();
          const fileName = UMMI_AUDIO_MAP[surahInfo.id];
          if (!fileName) return;
          const url = `https://archive.org/download/kid-recitation-murottal-anak-metode-ummi-juz-30/${encodeURIComponent(fileName)}`;
          if (ummiAudioRef.current) {
            ummiAudioRef.current.pause();
          }
          const audio = new Audio(url);
          ummiAudioRef.current = audio;
          audio.play().catch(e => {
            console.warn("Gagal memutar murottal anak Metode Ummi:", e);
            setIsUmmiPlaying(false);
          });
          setIsUmmiPlaying(true);
          audio.onended = () => setIsUmmiPlaying(false);
          audio.onerror = () => {
            setIsUmmiPlaying(false);
            if (showToast) showToast("Audio Metode Ummi sedang tidak dapat diakses.");
          };
        }
      };

      const handleQariChange = (qariId) => {
        stopAudio();
        stopUmmiAudio();
        setSelectedQari(qariId);
        selectedQariRef.current = qariId;
        localStorage.setItem('juz30_selected_qari', qariId);
        const qariObj = QARI_OPTIONS.find(q => q.id === qariId);
        if (showToast && qariObj) {
          showToast(`Suara bacaan: ${qariObj.name}`);
        }
      };

      const playAyahAudio = (ayahNum, onEndCallback) => {
        if (sliceIntervalRef.current) {
          clearInterval(sliceIntervalRef.current);
          sliceIntervalRef.current = null;
        }

        const qari = selectedQariRef.current;
        const surahId = surahInfo.id;
        const currentAyah = fullSurah?.ayahs?.find(a => a.number === ayahNum);
        if (!currentAyah) return;

        // Mode Metode Ummi Suara Anak Per Ayat
        if (qari === 'ummi_child') {
          const timing = getUmmiAyahTiming(surahId, ayahNum);
          const fileName = UMMI_AUDIO_MAP[surahId];

          if (timing && fileName) {
            const fullUrl = `https://archive.org/download/kid-recitation-murottal-anak-metode-ummi-juz-30/${encodeURIComponent(fileName)}`;

            let audio = audioRef.current;
            const needsNewAudio = !audio || activeAudioSrcRef.current !== fullUrl;

            if (needsNewAudio) {
              if (audio) audio.pause();
              audio = new Audio(fullUrl);
              audioRef.current = audio;
              activeAudioSrcRef.current = fullUrl;
            }

            const startPlayingSlice = () => {
              try {
                audio.currentTime = timing.start;
                audio.play().catch(e => console.warn("Gagal play audio slice:", e));

                sliceIntervalRef.current = setInterval(() => {
                  if (!audioRef.current) {
                    clearInterval(sliceIntervalRef.current);
                    return;
                  }
                  if (audio.currentTime >= timing.end) {
                    clearInterval(sliceIntervalRef.current);
                    sliceIntervalRef.current = null;
                    audio.pause();
                    if (onEndCallback) onEndCallback();
                  }
                }, 40);

                audio.onended = () => {
                  if (sliceIntervalRef.current) {
                    clearInterval(sliceIntervalRef.current);
                    sliceIntervalRef.current = null;
                  }
                  if (onEndCallback) onEndCallback();
                };
              } catch (e) {
                console.warn("Gagal play slice:", e);
                if (onEndCallback) onEndCallback();
              }
            };

            if (audio.readyState >= 1) {
              startPlayingSlice();
            } else {
              audio.addEventListener('loadedmetadata', startPlayingSlice, { once: true });
              audio.load();
            }
            return;
          }
        }

        // Qari reguler (Alafasy, Minshawi Talaqqi, Husary, Sudais, Juhany)
        const url = getAyahAudioUrl(currentAyah, qari, surahId);
        if (audioRef.current) audioRef.current.pause();
        audioRef.current = new Audio(url);
        activeAudioSrcRef.current = url;
        audioRef.current.play().catch(e => console.warn("Gagal putar audio:", e));
        audioRef.current.onended = () => { if (onEndCallback) onEndCallback(); };
        audioRef.current.onerror = () => { if (onEndCallback) onEndCallback(); };
      };

      const toggleAudio = (ayahNum) => {
        stopUmmiAudio();
        if (isSequencePlayingRef.current) stopAudio();

        if (playingAyah === ayahNum) {
          stopAudio();
        } else {
          stopAudio();
          setPlayingAyah(ayahNum);
          scrollToAyah(ayahNum);
          playAyahAudio(ayahNum, () => {
            setPlayingAyah(null);
          });
        }
      };

      const playSequence = (ayahNum) => {
        stopUmmiAudio();
        if (!fullSurah) return;
        setPlayingAyah(ayahNum);
        scrollToAyah(ayahNum);

        playAyahAudio(ayahNum, () => {
          if (!isSequencePlayingRef.current) {
            setPlayingAyah(null);
            return;
          }

          let next = ayahNum;
          if (repeatLimitRef.current === 'inf') {
            next = ayahNum;
          } else {
            if (currentLoopRef.current < repeatLimitRef.current) {
              currentLoopRef.current += 1;
              next = ayahNum;
            } else {
              currentLoopRef.current = 1;
              next = ayahNum + 1;
              if (next > targetRangeRef.current.end) {
                next = targetRangeRef.current.start;
              }
            }
          }
          // Tambah jeda 3 detik setelah per ayat khusus Metode Ummi agar santai dan tidak saling bertabrakan
          const delayMs = selectedQariRef.current === 'ummi_child' ? 3000 : 800;
          sequenceTimerRef.current = setTimeout(() => {
            sequenceTimerRef.current = null;
            if (isSequencePlayingRef.current) {
              playSequence(next);
            }
          }, delayMs);
        });
      };

      const toggleSequence = () => {
        if (isSequencePlayingRef.current) {
          stopAudio();
        } else {
          stopUmmiAudio();
          isSequencePlayingRef.current = true;
          setIsSequencePlaying(true);
          currentLoopRef.current = 1;
          playSequence(targetRangeRef.current.start);
        }
      };

      useEffect(() => {
        return () => {
          stopAudio();
          stopUmmiAudio();
        };
      }, []);

      const getBadgeStyle = (st) => {
        if (st === 'hafal') return 'bg-emerald-500 text-white';
        if (st === 'ulangi') return 'bg-amber-400 text-amber-950';
        if (st === 'belum') return 'bg-rose-500 text-white';
        return 'bg-slate-200 text-slate-500';
      };

      return (
        <div className="flex flex-col h-[82vh] md:h-[78vh] bg-white rounded-3xl shadow-sm border border-emerald-100 relative overflow-hidden max-w-5xl mx-auto">
          
          {/* STICKY HEADER ATAS (Tombol Navigasi & Kontrol Audio Tetap Ada Saat Scroll) */}
          <div className="bg-white/95 backdrop-blur-md border-b border-slate-200 p-3.5 sm:p-4 shadow-sm flex flex-wrap items-center justify-between z-30 gap-2 shrink-0">
            <div className="flex items-center space-x-3">
              <button onClick={onBack} className="p-2 bg-slate-100 hover:bg-slate-200 rounded-2xl active:scale-95 transition" title="Kembali">
                <Icon name="arrowLeft" size={18} />
              </button>
              <div>
                <h2 className="font-black text-base text-slate-800">{surahInfo.name}</h2>
                <p className="text-[11px] font-bold text-emerald-600">Ayat {startAyah} - {endAyah}</p>
              </div>
            </div>

            <div className="flex items-center flex-wrap gap-1.5 sm:gap-2">
              {/* Pilihan Suara Qari Cepat */}
              <div className="flex items-center bg-emerald-50 border border-emerald-200 rounded-xl px-2 py-1.5 shadow-2xs hover:bg-emerald-100/70 transition">
                <span className="text-xs mr-1 select-none">{selectedQari === 'ummi_child' ? '🧒' : selectedQari === 'minshawi_child' ? '👦' : '🎙️'}</span>
                <select 
                  value={selectedQari} 
                  onChange={(e) => handleQariChange(e.target.value)}
                  disabled={isSequencePlaying}
                  className="bg-transparent text-xs font-black text-emerald-950 outline-none cursor-pointer max-w-[130px] sm:max-w-none truncate"
                  title="Pilih Suara Qari / Metode Bacaan"
                >
                  {QARI_OPTIONS.map(q => (
                    <option key={q.id} value={q.id}>{q.badge} - {q.label}</option>
                  ))}
                </select>
              </div>

              <button 
                onClick={toggleSequence}
                className={`px-3 py-2 rounded-2xl text-white shadow-md transition flex items-center gap-1.5 text-xs font-black active:scale-95 ${isSequencePlaying ? 'bg-rose-500 animate-pulse' : 'bg-emerald-500 hover:bg-emerald-600'}`}
                title="Putar Otomatis Sesuai Suara Pilihan"
              >
                <Icon name={isSequencePlaying ? "square" : "play"} size={16} />
                <span>{isSequencePlaying ? "Berhenti" : "Putar Urut"}</span>
              </button>

              <div className="flex items-center bg-slate-100 rounded-xl px-2 py-1.5 border border-slate-200">
                <Icon name="repeat" size={14} className="text-slate-500 mr-1" />
                <select 
                  value={repeatLimit} 
                  onChange={(e) => setRepeatLimit(e.target.value === 'inf' ? 'inf' : Number(e.target.value))}
                  disabled={isSequencePlaying}
                  className="bg-transparent text-xs font-black text-slate-700 outline-none cursor-pointer"
                  title="Ulangi per ayat"
                >
                  <option value="1">1x</option>
                  <option value="2">2x</option>
                  <option value="3">3x</option>
                  <option value="5">5x</option>
                  <option value="inf">∞</option>
                </select>
              </div>

              <Button3D colorClass="yellow" className="px-3 py-2 text-xs" onClick={() => setShowEval(true)}>
                📝 Catat
              </Button3D>

              <button onClick={() => setShowSettings(!showSettings)} className="p-2 bg-emerald-100 text-emerald-700 hover:bg-emerald-200 rounded-2xl active:scale-95 transition" title="Pengaturan Tampilan & Suara">
                <Icon name="settings" size={18} />
              </button>
            </div>
          </div>

          {/* BAR PINTAS: Murottal Anak Metode Ummi (1 Surat Penuh) */}
          {hasUmmiAudio && (
            <div className={`transition-all border-b px-4 py-2.5 flex flex-wrap items-center justify-between gap-2.5 text-xs ${isUmmiPlaying ? 'bg-gradient-to-r from-amber-100 to-orange-100 border-amber-300 text-amber-950 shadow-inner' : 'bg-gradient-to-r from-amber-50/90 to-emerald-50/40 border-amber-200 text-amber-950'}`}>
              <div className="flex items-center gap-2.5">
                <div className={`w-8 h-8 rounded-xl flex items-center justify-center text-base shadow-xs shrink-0 ${isUmmiPlaying ? 'bg-amber-500 text-white animate-bounce' : 'bg-amber-100 text-amber-900 border border-amber-300'}`}>
                  🧒
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-black text-amber-950 text-xs sm:text-sm">Murottal Anak Metode Ummi</span>
                    <span className="px-1.5 py-0.5 rounded-md text-[10px] font-black bg-amber-200 text-amber-900 border border-amber-300">1 Surat Penuh</span>
                    {isUmmiPlaying && (
                      <span className="inline-flex items-center gap-1 text-[10px] font-black text-amber-800 bg-amber-200/90 px-2 py-0.5 rounded-full animate-pulse">
                        <span className="w-2 h-2 rounded-full bg-emerald-500"></span> Sedang Berputar
                      </span>
                    )}
                  </div>
                  <p className="text-[11px] text-amber-800 font-medium">
                    {isUmmiPlaying ? `Lantunan suara anak merdu khas irama Metode Ummi Surat ${surahInfo.name}` : `Dengarkan rekaman suara anak 1 surat penuh dengan irama Metode Ummi`}
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button 
                  onClick={toggleUmmiAudio}
                  className={`px-3.5 py-1.5 rounded-xl font-black flex items-center gap-1.5 shadow-sm transition text-xs active:scale-95 ${isUmmiPlaying ? 'bg-rose-500 hover:bg-rose-600 text-white shadow-rose-200' : 'bg-amber-500 hover:bg-amber-600 text-white shadow-amber-200'}`}
                >
                  <Icon name={isUmmiPlaying ? "square" : "play"} size={14} />
                  <span>{isUmmiPlaying ? "Hentikan Suara Anak" : "Putar Suara Anak (Metode Ummi)"}</span>
                </button>
              </div>
            </div>
          )}

          {showSettings && (
            <div className="bg-slate-50 p-4 m-3 rounded-2xl border border-slate-200 space-y-4 shrink-0 z-20 shadow-xs">
              <div className="flex flex-wrap items-center justify-between gap-4">
                <div>
                  <label className="text-[10px] font-black uppercase text-slate-400 tracking-wider">Format Tampilan</label>
                  <div className="flex bg-white rounded-xl p-1 border mt-1">
                    <button className={`px-4 py-1 text-xs font-bold rounded-lg ${mode === 'surat' ? 'bg-emerald-100 text-emerald-800' : 'text-slate-500'}`} onClick={() => setMode('surat')}>Per Ayat</button>
                    <button className={`px-4 py-1 text-xs font-bold rounded-lg ${mode === 'mushaf' ? 'bg-emerald-100 text-emerald-800' : 'text-slate-500'}`} onClick={() => setMode('mushaf')}>Mushaf</button>
                  </div>
                </div>

                <div className="flex gap-2">
                  <div>
                    <label className="text-[10px] font-black text-slate-400">Ayat Awal</label>
                    <input type="number" min="1" max={surahInfo.ayahCount} value={startAyah} onChange={(e) => setStartAyah(Number(e.target.value))} className="w-16 p-1.5 border rounded-xl text-center font-bold text-sm mt-0.5" />
                  </div>
                  <div>
                    <label className="text-[10px] font-black text-slate-400">Ayat Akhir</label>
                    <input type="number" min={startAyah} max={surahInfo.ayahCount} value={endAyah} onChange={(e) => setEndAyah(Number(e.target.value))} className="w-16 p-1.5 border rounded-xl text-center font-bold text-sm mt-0.5" />
                  </div>
                </div>

                {mode === 'surat' && (
                  <div className="flex items-center gap-4 text-xs font-bold text-slate-600">
                    <label className="flex items-center space-x-2 cursor-pointer">
                      <input type="checkbox" checked={showLatin} onChange={() => setShowLatin(!showLatin)} className="accent-emerald-600" />
                      <span>Latin</span>
                    </label>
                    <label className="flex items-center space-x-2 cursor-pointer">
                      <input type="checkbox" checked={showArti} onChange={() => setShowArti(!showArti)} className="accent-emerald-600" />
                      <span>Terjemahan</span>
                    </label>
                  </div>
                )}
              </div>

              {/* Pilihan Suara Bacaan (Qari) di Panel Pengaturan */}
              <div className="border-t border-slate-200 pt-3">
                <div className="flex items-center justify-between mb-2">
                  <label className="text-[10px] font-black uppercase text-slate-500 tracking-wider flex items-center gap-1.5">
                    <span>🎙️</span> Pilihan Suara Bacaan (Qari & Metode)
                  </label>
                  <span className="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">Tersimpan Otomatis</span>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5">
                  {QARI_OPTIONS.map((q) => {
                    const isSel = selectedQari === q.id;
                    return (
                      <button
                        key={q.id}
                        type="button"
                        onClick={() => handleQariChange(q.id)}
                        className={`text-left p-3 rounded-2xl border-2 transition-all relative flex flex-col justify-between ${isSel ? 'bg-emerald-50/90 border-emerald-500 shadow-sm ring-2 ring-emerald-200' : 'bg-white border-slate-200 hover:border-slate-300'}`}
                      >
                        <div className="flex items-start justify-between gap-1 mb-1">
                          <span className="font-black text-xs text-slate-800">{q.name}</span>
                          {isSel && <span className="text-emerald-600 text-xs font-black">✓ Aktif</span>}
                        </div>
                        <p className="text-[10px] text-slate-500 font-medium leading-relaxed mb-2">{q.desc}</p>
                        <div className="flex items-center gap-1">
                          <span className={`text-[9px] font-black px-2 py-0.5 rounded-lg border ${isSel ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-100 text-slate-600 border-slate-200'}`}>
                            {q.badge}
                          </span>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* KONTAINER AYAT DENGAN AUTO SCROLL */}
          <div ref={scrollContainerRef} className={`flex-1 overflow-y-auto p-4 md:p-6 hide-scrollbar ${mode === 'mushaf' ? 'mushaf-page rounded-2xl border m-3' : ''}`}>
            {isLoading ? (
              <div className="flex flex-col items-center justify-center py-20 text-emerald-600">
                <div className="w-10 h-10 border-4 border-emerald-300 border-t-transparent rounded-full animate-spin mb-3"></div>
                <p className="text-sm font-black">Mengunduh Surat {surahInfo.name}...</p>
              </div>
            ) : mode === 'mushaf' ? (
              <div className="max-w-3xl mx-auto">
                <div className="text-center mb-6">
                  <div className="font-arabic text-2xl font-bold bg-amber-100 text-amber-950 px-6 py-1.5 rounded-xl inline-block border border-amber-300">
                    سُورَةُ {surahInfo.name}
                  </div>
                  {surahInfo.id !== 9 && <div className="font-arabic text-xl mt-3 text-slate-700">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>}
                </div>
                <div className="font-arabic text-2xl md:text-3xl leading-[4.8rem] md:leading-[5.6rem] text-justify px-2 sm:px-4 py-3" dir="rtl" style={{ lineHeight: '2.6' }}>
                  {filteredAyahs.map((a) => (
                    <span 
                      key={a.number}
                      ref={el => ayahRefs.current[a.number] = el}
                      onClick={() => toggleAudio(a.number)}
                      className={`cursor-pointer transition-colors px-1.5 py-1 rounded-xl mx-0.5 ${playingAyah === a.number ? 'bg-amber-200 text-emerald-900 font-bold shadow-sm' : 'hover:text-emerald-700 hover:bg-emerald-50/80'}`}
                      title="Klik untuk dengarkan ayat"
                    >
                      {a.text} <span className="inline-flex items-center justify-center w-7 h-7 rounded-full border border-amber-300 bg-amber-50 text-xs mx-1.5 align-middle text-amber-950 font-sans font-bold shadow-2xs select-none">{a.number}</span>
                    </span>
                  ))}
                </div>
                {renderSurahNavBottom()}
              </div>
            ) : (
              <div className="space-y-4 max-w-3xl mx-auto">
                {surahInfo.id !== 9 && startAyah === 1 && (
                  <div className="text-center font-arabic text-2xl py-3 border-b text-slate-800">
                    بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم
                  </div>
                )}
                {filteredAyahs.map((a) => {
                  const status = getAyahStatus(progress, surahInfo.id, a.number);
                  const isPlaying = playingAyah === a.number;
                  return (
                    <div 
                      key={a.number} 
                      ref={el => ayahRefs.current[a.number] = el}
                      className={`rounded-2xl p-4 border transition-all relative ${isPlaying ? 'bg-emerald-50 border-emerald-400 shadow-md ring-2 ring-emerald-300' : 'bg-slate-50/80 border-slate-200'}`}
                    >
                      <div className={`absolute -top-2 -left-2 w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-black shadow ${getBadgeStyle(status)}`}>
                        {status === 'hafal' ? '★' : status === 'ulangi' ? '↺' : status === 'belum' ? '✕' : a.number}
                      </div>

                      <div className="flex items-start justify-between gap-4">
                        <button 
                          onClick={() => toggleAudio(a.number)}
                          className={`p-3 rounded-2xl shrink-0 transition ${isPlaying ? 'bg-emerald-600 text-white shadow-lg animate-bounce' : 'bg-white text-emerald-600 border border-emerald-200 hover:bg-emerald-50'}`}
                          title={isPlaying ? "Hentikan suara" : `Dengarkan ayat ${a.number} (${selectedQari === 'ummi_child' ? 'Metode Ummi (Anak)' : selectedQari === 'minshawi_child' ? 'Al-Minshawi & Suara Anak' : 'Qari'})`}
                        >
                          <Icon name={isPlaying ? "square" : "play"} size={16} />
                        </button>
                        <div className="font-arabic text-2xl md:text-3xl text-right leading-loose flex-1 text-slate-900" dir="rtl">
                          {a.text}
                        </div>
                      </div>

                      {showLatin && <p className="text-emerald-700 font-bold text-xs md:text-sm mt-3 italic">{a.latin}</p>}
                      {showArti && <p className="text-slate-600 text-xs md:text-sm mt-1 leading-relaxed">{a.translation}</p>}
                    </div>
                  );
                })}
                {renderSurahNavBottom()}
              </div>
            )}
          </div>

          {showEval && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white w-full max-w-md rounded-3xl p-5 max-h-[85vh] flex flex-col shadow-2xl">
                <div className="flex justify-between items-center mb-3">
                  <div>
                    <h3 className="font-black text-base text-slate-800">Catat Hafalan Anak</h3>
                    <p className="text-xs font-bold text-slate-400">Surat {surahInfo.name} (Ayat {startAyah} - {endAyah})</p>
                  </div>
                  <button onClick={() => setShowEval(false)} className="p-2 bg-slate-100 rounded-full hover:bg-slate-200">
                    <Icon name="close" size={18} />
                  </button>
                </div>

                <Button3D 
                  colorClass="green" 
                  className="w-full py-2.5 text-xs mb-3"
                  onClick={() => {
                    const batch = filteredAyahs.map(a => ({ surahId: surahInfo.id, ayahNum: a.number, status: 'hafal' }));
                    updateMultipleProgress(batch);
                    setShowEval(false);
                  }}
                >
                  ★ Alhamdulillah, Sudah Hafal Semua Ini!
                </Button3D>

                <div className="flex-1 overflow-y-auto space-y-2 pr-1 hide-scrollbar">
                  {filteredAyahs.map(a => {
                    const st = getAyahStatus(progress, surahInfo.id, a.number);
                    return (
                      <div key={a.number} className="flex items-center justify-between p-2.5 bg-slate-50 rounded-2xl border border-slate-200">
                        <span className="font-black text-xs text-slate-700 bg-white w-9 h-9 rounded-xl flex items-center justify-center border shadow-xs">
                          Ay. {a.number}
                        </span>
                        <div className="flex space-x-1.5">
                          <button 
                            onClick={() => updateProgress(surahInfo.id, a.number, 'belum')}
                            className={`px-2.5 py-1.5 rounded-xl text-[11px] font-bold transition border ${st === 'belum' ? 'bg-rose-500 text-white border-rose-600' : 'bg-white text-slate-600'}`}
                          >✕ Belum</button>
                          <button 
                            onClick={() => updateProgress(surahInfo.id, a.number, 'ulangi')}
                            className={`px-2.5 py-1.5 rounded-xl text-[11px] font-bold transition border ${st === 'ulangi' ? 'bg-amber-400 text-amber-950 border-amber-500' : 'bg-white text-slate-600'}`}
                          >↺ Ulangi</button>
                          <button 
                            onClick={() => updateProgress(surahInfo.id, a.number, 'hafal')}
                            className={`px-2.5 py-1.5 rounded-xl text-[11px] font-bold transition border ${st === 'hafal' ? 'bg-emerald-500 text-white border-emerald-600' : 'bg-white text-slate-600'}`}
                          >★ Hafal</button>
                        </div>
                      </div>
                    );
                  })}
                </div>

                <Button3D colorClass="white" className="w-full py-2.5 text-xs mt-3" onClick={() => setShowEval(false)}>
                  Tutup
                </Button3D>
              </div>
            </div>
          )}
        </div>
      );
    }

            <p className="text-xs text-purple-100 font-medium mt-0.5">Kenali cerita menarik di balik surat hafalanmu!</p>
          </div>

          <div className="relative max-w-md mx-auto">
            <div className="absolute left-3.5 top-3.5 text-slate-400"><Icon name="search" size={18} /></div>
            <input 
              type="text" 
              placeholder="Cari cerita surat..." 
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              className="w-full bg-white border-2 border-purple-100 p-3 pl-10 rounded-2xl font-bold text-sm text-slate-700 outline-none focus:border-purple-400 shadow-sm"

            {filtered.map(s => (
              <div 
                key={s.id}
                onClick={() => onSelect(s.id.toString())}
                className="bg-white p-4 rounded-2xl shadow-sm border-2 border-transparent hover:border-purple-300 cursor-pointer flex items-center justify-between active:scale-[0.98] transition"
              >
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 bg-purple-100 text-purple-800 rounded-2xl flex items-center justify-center font-black text-sm border border-purple-200">
                    {s.id}
                  </div>
                  <div>
                    <h3 className="font-extrabold text-slate-800 text-sm">{s.name}</h3>
                    <p className="text-[11px] font-semibold text-slate-400">{s.meaning}</p>

                </div>

              </div>
            ))}
          </div>
        </div>
      );

    function MaknaDetail({ surah, onBack, showToast }) {
      const [isSpeaking, setIsSpeaking] = useState(false);

      useEffect(() => {
        return () => {
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        };
      }, []);

      const toggleSpeech = () => {
        if (!('speechSynthesis' in window)) {
          if (showToast) showToast('Peramban ini belum mendukung pembaca suara.');
          return;
        }

        if (isSpeaking) {
          window.speechSynthesis.cancel();
          setIsSpeaking(false);
        } else {
          window.speechSynthesis.cancel();
          const lessonsText = (surah.moralLessons || []).join('. ');
          const narasi = `Kisah Surat ${surah.name}, artinya ${surah.meaning}. Surat ini tergolong surah ${surah.revelation} dengan jumlah ${surah.ayahCount} ayat. ${surah.summary}. Pelajaran berharganya adalah: ${lessonsText}. Amalan harian yang bisa diamalkan: ${surah.dailyPractice || ''}`;
          const utt = new SpeechSynthesisUtterance(narasi);
          utt.lang = 'id-ID';
          utt.rate = 0.95;
          utt.pitch = 1.1;
          utt.onend = () => setIsSpeaking(false);
          utt.onerror = () => setIsSpeaking(false);
          window.speechSynthesis.speak(utt);
          setIsSpeaking(true);
        }
      };

      return (
        <div className="flex flex-col h-full bg-purple-50 rounded-3xl p-4 md:p-6 shadow-sm relative max-w-4xl mx-auto">
          <div className="flex items-center mb-4">
            <button onClick={onBack} className="p-2.5 bg-white hover:bg-slate-50 text-slate-700 rounded-2xl shadow-sm mr-3 active:scale-95 transition border border-purple-100">
              <Icon name="arrowLeft" size={20} />
            </button>
            <div>
              <h2 className="font-black text-lg md:text-xl text-slate-800">Cerita & Makna Surat {surah.name}</h2>
              <p className="text-xs font-bold text-slate-400">Tadabbur Juz 30 untuk Generasi Qur'ani</p>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto space-y-4 pb-28 hide-scrollbar">
            {/* Banner Identitas Surat */}
            <div className="bg-white p-6 rounded-3xl shadow-sm border-2 border-purple-100 text-center relative overflow-hidden">
              <div className="font-arabic text-3xl md:text-4xl text-purple-700 font-bold mb-1">
                سُورَةُ {surah.name}
              </div>
              <h1 className="text-2xl font-black text-slate-800">{surah.name}</h1>
              <p className="text-sm font-bold text-purple-600 italic mt-0.5">"{surah.meaning}"</p>
              <div className="flex justify-center gap-2 sm:gap-3 mt-4 text-xs font-extrabold text-slate-600 flex-wrap">
                <span className="bg-purple-50 text-purple-800 px-3.5 py-1.5 rounded-xl border border-purple-200">
                  {surah.ayahCount} Ayat
                </span>
                <span className="bg-purple-50 text-purple-800 px-3.5 py-1.5 rounded-xl border border-purple-200">
                  Surah {surah.revelation}
                </span>
                <span className="bg-purple-50 text-purple-800 px-3.5 py-1.5 rounded-xl border border-purple-200">
                  Nomor Surat {surah.id}
                </span>
              </div>
            </div>

            {/* Intisari & Tema Utama */}
            {surah.mainTheme && (
              <div className="bg-white p-5 rounded-3xl shadow-sm border border-purple-100">
                <div className="flex items-center gap-2 mb-2 text-purple-900">
                  <span className="text-xl">🌟</span>
                  <h3 className="font-black text-sm md:text-base">Tema Utama Surat</h3>
                </div>
                <p className="text-slate-700 text-sm font-semibold leading-relaxed">
                  {surah.mainTheme}
                </p>
              </div>
            )}

            {/* Kisah & Tafsir Mendalam */}
            <div className="bg-white p-6 rounded-3xl shadow-sm border border-sky-100">
              <div className="flex items-center gap-2 mb-3 text-sky-900">
                <span className="text-xl">📖</span>
                <h3 className="font-black text-base md:text-lg">Kisah Mendalam & Tafsir Edukatif</h3>
              </div>
              <p className="text-slate-700 text-sm md:text-base leading-relaxed text-justify font-medium">
                {surah.summary}
              </p>
            </div>

            {/* Pelajaran Berharga & Nilai Akhlak */}
            {surah.moralLessons && surah.moralLessons.length > 0 && (
              <div className="bg-emerald-50/80 p-5 rounded-3xl shadow-sm border-2 border-emerald-100">
                <div className="flex items-center gap-2 mb-3 text-emerald-900">
                  <span className="text-xl">💎</span>
                  <h3 className="font-black text-sm md:text-base">Pelajaran Berharga & Akhlak Mulia</h3>
                </div>
                <ul className="space-y-2 text-xs md:text-sm font-semibold text-emerald-950">
                  {surah.moralLessons.map((lesson, idx) => (
                    <li key={idx} className="flex items-start gap-2">
                      <span className="w-5 h-5 bg-emerald-200 text-emerald-800 rounded-full flex items-center justify-center font-black text-xs shrink-0 mt-0.5">
                        {idx + 1}
                      </span>
                      <span className="leading-snug">{lesson}</span>
                    </li>
                  ))}
                </ul>
              </div>
            )}

            {/* Amalan Cilik Sehari-hari */}
            {surah.dailyPractice && (
              <div className="bg-amber-50/90 p-5 rounded-3xl shadow-sm border-2 border-amber-200">
                <div className="flex items-center gap-2 mb-2 text-amber-900">
                  <span className="text-xl">🤲</span>
                  <h3 className="font-black text-sm md:text-base">Amalan Cilik untuk Pejuang Qur'an</h3>
                </div>
                <p className="text-amber-950 text-xs md:text-sm font-bold leading-relaxed">
                  {surah.dailyPractice}
                </p>
              </div>
            )}
          </div>

          <div className="absolute bottom-4 left-6 right-6">
            <Button3D 
              colorClass={isSpeaking ? "red" : "purple"}
              className="w-full py-3.5 text-sm md:text-base flex items-center justify-center gap-2 shadow-lg"
              onClick={toggleSpeech}
            >
              <Icon name={isSpeaking ? "square" : "headphones"} size={22} />
              <span>{isSpeaking ? "Hentikan Narasi Suara" : "Dengarkan Cerita Suara Lengkap 🎙️"}</span>
            </Button3D>
          </div>
        </div>
      );
    }

    function TentangView({ onNavigate, showToast }) {
      const [showQrisModal, setShowQrisModal] = useState(false);

      const handleInstallClick = () => {
        if (window.deferredInstallPrompt) {
          window.deferredInstallPrompt.prompt();
          window.deferredInstallPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
              if (showToast) showToast('Alhamdulillah, pintasan berhasil dipasang! 🌟');
            }
            window.deferredInstallPrompt = null;
          });
        } else {
          if (showToast) showToast('Buka menu titik tiga (⋮) di browser lalu pilih Buat pintasan / Instal 📱');
          const el = document.getElementById('panduan-instal-manual');
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      };

      return (

    /* =========================================================================

       ========================================================================= */
    function HaditsListView({ haditsProgress = {}, onToggleHadits, onSetAllHadits, haditsHafalCount = 0, haditsPercentage = 0, showToast }) {
      const haditsList = window.haditsArbainList || [];
      const [searchQuery, setSearchQuery] = useState('');
      const [filterTab, setFilterTab] = useState('all'); // 'all', 'hafal', 'belum'
      const [speakingId, setSpeakingId] = useState(null);

      const filteredHadits = useMemo(() => {
        return haditsList.filter(h => {
          const isHafal = haditsProgress[h.id]?.status === 'hafal' || haditsProgress[h.id] === 'hafal';
          if (filterTab === 'hafal' && !isHafal) return false;
          if (filterTab === 'belum' && isHafal) return false;
          if (!searchQuery.trim()) return true;
          const q = searchQuery.toLowerCase();
          return h.title.toLowerCase().includes(q) || 
                 h.translation.toLowerCase().includes(q) || 
                 h.narrator.toLowerCase().includes(q) ||
                 h.id.toString() === q;
        });
      }, [haditsList, haditsProgress, filterTab, searchQuery]);

      const speakHadits = (h) => {
        if ('speechSynthesis' in window) {
          if (speakingId === h.id) {
            window.speechSynthesis.cancel();
            setSpeakingId(null);
            return;
          }
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(`Hadits ke-${h.id}. ${h.title}. ${h.translation}`);
          utterance.lang = 'id-ID';
          utterance.rate = 0.95;
          utterance.onend = () => setSpeakingId(null);
          utterance.onerror = () => setSpeakingId(null);
          setSpeakingId(h.id);
          window.speechSynthesis.speak(utterance);
        } else {
          if (showToast) showToast('Fitur suara tidak didukung di perangkat ini.');
        }
      };

      return (
        <div className="space-y-6 pb-24 max-w-4xl mx-auto">
          {/* Header Banner Persentase Hadits */}
          <div className="bg-gradient-to-r from-sky-600 via-teal-600 to-emerald-700 text-white p-6 sm:p-8 rounded-3xl shadow-lg border border-sky-400/30 relative overflow-hidden">
            <div className="relative z-10">
              <div className="flex flex-col sm:flex-row items-center justify-between gap-4">
                <div className="text-center sm:text-left">
                  <div className="inline-flex items-center gap-1.5 px-3 py-1 bg-white/20 rounded-full text-xs font-black mb-2">
                    <span>📜</span>
                    <span>50 Hadits Arbain An-Nawawi</span>
                  </div>
                  <h2 className="text-xl sm:text-2xl font-black tracking-tight">
                    Hafalan Hadits Rasulullah ﷺ
                  </h2>
                  <p className="text-xs sm:text-sm text-sky-100 font-medium max-w-md mt-1">
                    Pelajari dan hafalkan 50 hadits pokok pembentuk kepribadian santri bertakwa dan berakhlak mulia.
                  </p>
                </div>

                {/* Progress Wheel / Counter */}
                <div className="bg-white/15 backdrop-blur-md p-4 rounded-2xl border border-white/20 text-center shrink-0 min-w-[140px]">
                  <div className="text-xs font-bold text-sky-100 uppercase">Capaian Hadits</div>
                  <div className="text-3xl sm:text-4xl font-black text-amber-300 mt-0.5">
                    {haditsPercentage}%
                  </div>
                  <div className="text-xs font-extrabold text-white mt-1">
                    {haditsHafalCount} / 50 Hadits
                  </div>
                </div>
              </div>

              {/* Progress Bar Visual */}
              <div className="w-full bg-sky-950/40 h-3 rounded-full mt-5 overflow-hidden p-0.5 border border-sky-400/30">
                <div 
                  className="bg-amber-300 h-full rounded-full transition-all duration-500 shadow-sm"
                  style={{ width: `${haditsPercentage}%` }}
                ></div>
              </div>

              {/* Tombol Aksi Tandai Semua */}
              <div className="mt-4 pt-3 border-t border-white/15 flex flex-wrap items-center justify-between gap-2">
                <span className="text-xs text-sky-100 font-semibold">
                  Tandai hadits yang telah dihafal untuk menghitung persentase.
                </span>
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => {
                      onSetAllHadits(true);
                      if (showToast) showToast('Alhamdulillah, semua hadits ditandai hafal! 🌟');
                    }}
                    className="px-3 py-1.5 bg-white/20 hover:bg-white/30 text-white text-xs font-black rounded-xl transition active:scale-95"
                  >
                    ✅ Tandai Semua Hafal
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      onSetAllHadits(false);
                      if (showToast) showToast('Daftar hafalan hadits telah direset.');
                    }}
                    className="px-3 py-1.5 bg-rose-500/30 hover:bg-rose-500/40 text-rose-100 text-xs font-bold rounded-xl transition active:scale-95"

                  filterTab === 'all'
                    ? 'bg-sky-600 text-white shadow-xs'
                    : 'bg-slate-100 text-slate-600 hover:bg-slate-200'

                Semua Hadits (50)

              <button

                onClick={() => setFilterTab('hafal')}

              </button>
              <button
                type="button"
                onClick={() => setFilterTab('belum')}
                className={`px-3.5 py-1.5 rounded-xl text-xs font-black transition ${
                  filterTab === 'belum'
                    ? 'bg-amber-500 text-white shadow-xs'
                    : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                }`}
              >
                Belum Dihafal ({50 - haditsHafalCount})
              </button>
            </div>
          </div>

          {/* List 50 Hadits */}
          <div className="space-y-4">
            {filteredHadits.length === 0 ? (
              <div className="bg-white rounded-3xl p-8 text-center border-2 border-slate-200">
                <span className="text-4xl">🔍</span>
                <p className="font-extrabold text-sm text-slate-600 mt-2">Hadits tidak ditemukan</p>
                <p className="text-xs text-slate-400 mt-1">Coba gunakan kata kunci pencarian yang lain.</p>
              </div>
            ) : (
              filteredHadits.map((hadits) => {
                const isHafal = haditsProgress[hadits.id]?.status === 'hafal' || haditsProgress[hadits.id] === 'hafal';
                const isSpeaking = speakingId === hadits.id;

                return (
                  <div 
                    key={hadits.id} 
                    className={`bg-white rounded-3xl p-5 sm:p-6 border-2 transition-all shadow-xs ${
                      isHafal ? 'border-emerald-300 ring-2 ring-emerald-100' : 'border-slate-200/90'

                  >

                    <div className="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100 mb-3">

                        {/* Tombol Dengarkan Audio */}
                        <button
                          type="button"

                          className={`p-2 rounded-xl text-xs font-bold transition flex items-center gap-1 ${

                              ? 'bg-rose-100 text-rose-700 animate-pulse' 
                              : 'bg-slate-100 hover:bg-slate-200 text-slate-600'

                        {/* Status Hafalan Button */}
                        <button
                          type="button"
                          onClick={() => {
                            onToggleHadits(hadits.id);

    function CertificateModal({ userData, progress = {}, haditsHafalCount = 0, onClose }) {
      const studentName = userData?.name || 'Santri Hebat';

      // Hitung Surat dan Ayat yang hafal
      const completedSurahs = useMemo(() => {
        return juz30SurahList.filter(s => {
          for (let i = 1; i <= s.ayahCount; i++) {
            if (getAyahStatus(progress, s.id, i) !== 'hafal') return false;
          }
          return true;
        });
      }, [progress]);

      const completedSurahsCount = completedSurahs.length;
      const totalMemorizedAyahs = Object.keys(progress).filter(k => {
        const p = progress[k];
        return (p && typeof p === 'object' ? p.status : p) === 'hafal';
      }).length;

      const [isDownloading, setIsDownloading] = useState(false);

      const downloadPDF = () => {
        const certEl = document.getElementById('sertifikat-print-area');
        if (!certEl) return;
        setIsDownloading(true);

        if (window.html2pdf) {
          const opt = {
            margin: 5,
            filename: `Sertifikat_Hafalan_${studentName.replace(/\s+/g, '_')}_Juz30.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, logging: false },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
          };
          window.html2pdf().set(opt).from(certEl).save().then(() => {
            setIsDownloading(false);
          }).catch(() => {
            setIsDownloading(false);
            window.print();
          });
        } else {
          setIsDownloading(false);
          window.print();
        }
      };
