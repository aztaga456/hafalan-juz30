        const decodeGoogleJwt = (token) => {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(
          atob(base64)
            .split('')
            .map((c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
            .join('')
        );
        return JSON.parse(jsonPayload);
      } catch (e) {
        console.error("Gagal decode JWT Google:", e);
        return null;
      }
    };

    const resizeImage = (file, maxWidth = 256, maxHeight = 256) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    };

    function App() {
      const [token, setToken] = useState(localStorage.getItem('juz30_gas_token') || null);
      const [userData, setUserData] = useState(null);
      const [progress, setProgress] = useState({});
      const [loading, setLoading] = useState(true);
      const [isOfflineMode, setIsOfflineMode] = useState(false);

      const [surahCache, setSurahCache] = useState({});
      const [currentView, setCurrentView] = useState('login');
      const [showCertificateModal, setShowCertificateModal] = useState(false);
      const [haditsProgress, setHaditsProgress] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('juz30_hadits_progress') || '{}');
        } catch {
          return {};
        }
      });

      const haditsHafalCount = useMemo(() => {
        return Object.keys(haditsProgress).filter(k => haditsProgress[k]?.status === 'hafal' || haditsProgress[k] === 'hafal').length;
      }, [haditsProgress]);

      const haditsPercentage = Math.min(100, Math.round((haditsHafalCount / 50) * 100)) || 0;

      const toggleHaditsMemorized = (id) => {
        setHaditsProgress(prev => {
          const updated = { ...prev };
          const isHafal = updated[id]?.status === 'hafal' || updated[id] === 'hafal';
          if (isHafal) {
            delete updated[id];
          } else {
            updated[id] = { status: 'hafal', timestamp: Date.now() };
          }
          localStorage.setItem('juz30_hadits_progress', JSON.stringify(updated));
          saveToActiveAccountStorage(null, null, updated);
          return updated;
        });
      };

      const setAllHaditsMemorized = (isAll) => {
        const updated = {};
        if (isAll) {
          const list = window.haditsArbainList || [];
          const now = Date.now();
          list.forEach(h => {
            updated[h.id] = { status: 'hafal', timestamp: now };
          });
        }
        setHaditsProgress(updated);
        localStorage.setItem('juz30_hadits_progress', JSON.stringify(updated));
        saveToActiveAccountStorage(null, null, updated);
      };
      const [selectedSurah, setSelectedSurah] = useState(null);
      const [targetRange, setTargetRange] = useState(null);
      const [previousList, setPreviousList] = useState('readingList');
      const [toastMsg, setToastMsg] = useState(null);
      const [isEditProfileOpen, setIsEditProfileOpen] = useState(false);

      const handleUpdateProfile = async (updates) => {
        const updatedUser = { ...userData, ...updates };
        setUserData(updatedUser);
        localStorage.setItem('juz30_local_user', JSON.stringify(updatedUser));
        saveToActiveAccountStorage(updatedUser, null, null);

        if (token && gasBridge.isGAS) {
          try {
            await gasBridge.call('apiUpdateProfile', { token, ...updates });
          } catch (err) {
            console.error("Gagal sinkron profil ke GAS:", err);
          }
        }
        showToast("Profil berhasil diperbarui! 🎉");
        setIsEditProfileOpen(false);
      };

      const ulangiListCount = useMemo(() => {
        return Object.values(progress).filter(p => {
          return (p && typeof p === 'object' ? p.status : p) === 'ulangi';
        }).length;
      }, [progress]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3200);
      };

      const loadUserData = async (authToken) => {
        setLoading(true);
        try {
          if (gasBridge.isGAS) {
            const res = await gasBridge.call('apiGetMe', authToken);
            if (res && res.success) {
              setUserData(res.user);
              setProgress(res.progress || {});
              setCurrentView('dashboard');
              setIsOfflineMode(false);
              setLoading(false);
              return;
            }
          }
          throw new Error("Sesi tidak ditemukan di server GAS");
        } catch (err) {
          const localUser = JSON.parse(localStorage.getItem('juz30_local_user') || 'null');
          const localProg = JSON.parse(localStorage.getItem('juz30_local_progress') || '{}');
          if (localUser) {
            setUserData(localUser);
            setProgress(localProg);
            setCurrentView('dashboard');
            setIsOfflineMode(true);
          } else {
            setCurrentView('login');
          }
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        // Cek apakah ada parameter URL untuk auto-login / magic link (quick_login)
        try {
          const urlParams = new URLSearchParams(window.location.search);
          if (urlParams.get('quick_login') === 'true') {
            const qEmail = (urlParams.get('email') || '').toLowerCase().trim();
            const qKey = urlParams.get('key');
            if (qEmail && qKey) {
              const storageKey = `juz30_account_${qEmail}`;
              let acc = null;
              try { acc = JSON.parse(localStorage.getItem(storageKey) || 'null'); } catch(e){}
              if (acc && acc.user) {
                acc.user.password = qKey;
                localStorage.setItem(storageKey, JSON.stringify(acc));
                window.history.replaceState({}, document.title, window.location.pathname);
                handleLoginSuccess('magic_' + Date.now(), acc.user, acc.progress || {}, acc.haditsProgress || {});
                showToast("Berhasil masuk via tautan cepat! Silakan atur kata sandi baru Anda di profil 🔑");
                setIsEditProfileOpen(true);
                return;
              }
            }
          }
        } catch (e) {}

        if (token) {
          loadUserData(token);
        } else {
          const currentEmail = localStorage.getItem('juz30_current_email');
          let localUser = null;
          let localProg = {};
          let localHadits = {};

          if (currentEmail) {
            const storageKey = `juz30_account_${currentEmail.toLowerCase()}`;
            const accountData = JSON.parse(localStorage.getItem(storageKey) || 'null');
            if (accountData) {
              localUser = accountData.user;
              localProg = accountData.progress || {};
              localHadits = accountData.haditsProgress || {};
            }
          }

          if (!localUser) {
            localUser = JSON.parse(localStorage.getItem('juz30_local_user') || 'null');
            localProg = JSON.parse(localStorage.getItem('juz30_local_progress') || '{}');
            localHadits = JSON.parse(localStorage.getItem('juz30_hadits_progress') || '{}');
          }

          if (localUser) {
            setUserData(localUser);
            setProgress(localProg);
            setHaditsProgress(localHadits);
            setCurrentView('dashboard');
            setIsOfflineMode(true);
          }
          setLoading(false);
        }
      }, []);

      // Helper penyimpanan internal multi-akun berdasarkan email
      const saveToActiveAccountStorage = (updatedUser = null, updatedQuranProgress = null, updatedHaditsProgress = null) => {
        const activeEmail = (
          (updatedUser && updatedUser.email) ||
          (userData && userData.email) ||
          localStorage.getItem('juz30_current_email') ||
          ''
        ).toLowerCase().trim();

        if (activeEmail) {
          const storageKey = `juz30_account_${activeEmail}`;
          let accountData = null;
          try {
            accountData = JSON.parse(localStorage.getItem(storageKey) || 'null');
          } catch (e) {}

          if (!accountData) {
            accountData = { user: updatedUser || userData, progress: {}, haditsProgress: {} };
          }
          if (updatedUser) accountData.user = { ...(accountData.user || {}), ...updatedUser };
          if (updatedQuranProgress) accountData.progress = updatedQuranProgress;
          if (updatedHaditsProgress) accountData.haditsProgress = updatedHaditsProgress;

          localStorage.setItem(storageKey, JSON.stringify(accountData));
          localStorage.setItem('juz30_current_email', activeEmail);
        }
      };

      // Sinkronisasi otomatis ke akun setiap kali progress berubah saat login
      useEffect(() => {
        if (userData?.email && Object.keys(progress).length > 0) {
          saveToActiveAccountStorage(userData, progress, null);
        }
      }, [progress]);

      useEffect(() => {
        if (userData?.email && Object.keys(haditsProgress).length > 0) {
          saveToActiveAccountStorage(userData, null, haditsProgress);

      }, [haditsProgress]);

      const handleLoginSuccess = (authToken, user, initialProgress = {}, initialHaditsProgress = null) => {
        setToken(authToken);
        localStorage.setItem('juz30_gas_token', authToken);
        localStorage.setItem('juz30_local_user', JSON.stringify(user));
        const userEmail = (user?.email || '').toLowerCase().trim();
        if (userEmail) {
          localStorage.setItem('juz30_current_email', userEmail);
        }
        setUserData(user);

        // Ambil data progress terbaik: prioritaskan initialProgress, jika kosong ambil dari storage akun email ini
        let newProg = initialProgress;
        if (!newProg || Object.keys(newProg).length === 0) {
          if (userEmail) {
            try {
              const acc = JSON.parse(localStorage.getItem(`juz30_account_${userEmail}`) || '{}');
              if (acc.progress && Object.keys(acc.progress).length > 0) {
                newProg = acc.progress;
              }
            } catch(e) {}
          }
        }
        newProg = newProg || {};
        setProgress(newProg);
        localStorage.setItem('juz30_local_progress', JSON.stringify(newProg));

        let newHadits = initialHaditsProgress;
        if (!newHadits || Object.keys(newHadits).length === 0) {
          if (userEmail) {
            try {
              const acc = JSON.parse(localStorage.getItem(`juz30_account_${userEmail}`) || '{}');
              if (acc.haditsProgress && Object.keys(acc.haditsProgress).length > 0) {
                newHadits = acc.haditsProgress;
              }
            } catch(e) {}
          }
          if (!newHadits || Object.keys(newHadits).length === 0) {
            try {
              newHadits = JSON.parse(localStorage.getItem('juz30_hadits_progress') || '{}');
            } catch {
              newHadits = {};
            }
          }
        }
        newHadits = newHadits || {};
        setHaditsProgress(newHadits);
        localStorage.setItem('juz30_hadits_progress', JSON.stringify(newHadits));

        // Sinkronisasi data ke internal storage per-akun
        saveToActiveAccountStorage(user, newProg, newHadits);

        setCurrentView('dashboard');
        setIsOfflineMode(!gasBridge.isGAS);
        showToast(`Ahlan wa Sahlan, ${user.name}! 🌟`);

      const handleLogout = () => {

          (userData && userData.email) ||
          localStorage.getItem('juz30_current_email') ||

          saveToActiveAccountStorage(userData, progress, haditsProgress);

        localStorage.removeItem('juz30_current_email');
        localStorage.removeItem('juz30_local_user');

        if (token && gasBridge.isGAS) {
          try {
            await gasBridge.call('apiSaveProgress', { token, surahId, ayahNum, status, timestamp });

            console.error("Gagal sinkron progres ke server:", err);
          }

      };

      const updateMultipleProgress = async (updates) => {
        const updated = { ...progress };
        const now = Date.now();
        updates.forEach(u => {
          updated[`${u.surahId}_${u.ayahNum}`] = { status: u.status, timestamp: now };
        });
        setProgress(updated);
        localStorage.setItem('juz30_local_progress', JSON.stringify(updated));
        saveToActiveAccountStorage(null, updated, null);

        if (token && gasBridge.isGAS) {
          try {
            await gasBridge.call('apiSaveBulkProgress', { token, updates, timestamp: now });

            console.error("Gagal sinkron progres borongan:", err);

            } else {
              // Jika sebelumnya pernah diisi hafal, hapus dari progress

                delete updated[key];
                bulkUpdates.push({ surahId: s.id, ayahNum: i, status: null });
              }
            }
          }
        });

        setProgress(updated);
        localStorage.setItem('juz30_local_progress', JSON.stringify(updated));
        saveToActiveAccountStorage(null, updated, null);

        if (token && gasBridge.isGAS) {
          try {
            await gasBridge.call('apiSaveBulkProgress', { token, updates: bulkUpdates, timestamp: now });

    function LoginScreen({ onLoginSuccess, onOfflineGuest }) {

      const [isGoogleReady, setIsGoogleReady] = useState(false);
      
      // State Lupa Password
      const [showForgotPassword, setShowForgotPassword] = useState(false);
      const [forgotEmail, setForgotEmail] = useState("");
      const [forgotSent, setForgotSent] = useState(false);
      const [forgotMsg, setForgotMsg] = useState("");
      const [isSendingForgot, setIsSendingForgot] = useState(false);
      const [generatedTempPass, setGeneratedTempPass] = useState("");
      const [generatedMagicLink, setGeneratedMagicLink] = useState("");
      const [copiedPass, setCopiedPass] = useState(false);

      // State untuk Popup Awal Konfirmasi Profil Google (Nama & Foto)
      const [googleConfirmUser, setGoogleConfirmUser] = useState(null);

      const GOOGLE_CLIENT_ID = "717248894370-kaqmf98v6m1hsts6cdlhp29k9t2r8chi.apps.googleusercontent.com";
      const avatarOptions = ['🦁', '🐯', '🐼', '🐰', '🦊', '🐨', '🦄', '🐬'];

      // Render tombol resmi Google sesuai mode (signin_with vs signup_with)
      useEffect(() => {
        let isMounted = true;
        let isInitialized = false;

        const setupGoogleSignIn = () => {
          if (isInitialized) return;
          if (window.google?.accounts?.id) {
            isInitialized = true;
            try {
              window.google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleGoogleResponse,
                auto_select: false,
                cancel_on_tap_outside: true
              });

              const container = document.getElementById("googleSignInBtnContainer");
              if (container) {
                container.innerHTML = "";
                window.google.accounts.id.renderButton(container, {
                  type: "standard",
                  theme: "outline",
                  size: "large",
                  text: isLogin ? "signin_with" : "signup_with",
                  shape: "pill",
                  width: 300,
                  logo_alignment: "left"
                });
              }
              window.__handleGoogleResponse = handleGoogleResponse;
              if (isMounted) setIsGoogleReady(true);
            } catch (err) {
              console.warn("GSI init info:", err);
            }
          }
        };

        setupGoogleSignIn();
        const timer = setInterval(() => {
          if (window.google?.accounts?.id && !isInitialized) {
            setupGoogleSignIn();
            clearInterval(timer);
          }
        }, 400);

        return () => {
          isMounted = false;
          clearInterval(timer);
        };
      }, [isLogin, showForgotPassword]);

      // Saat Google mengembalikan token kredensial
      const handleGoogleResponse = (response) => {
        if (!response?.credential) {
          setError("Gagal menerima kredensial akun Google.");
          return;
        }
        window.__handleGoogleResponse = handleGoogleResponse;

        const payload = decodeGoogleJwt(response.credential);
        if (!payload || !payload.email) {
          setError("Data profil akun Google tidak lengkap.");
          return;
        }

        const userEmail = payload.email.toLowerCase().trim();
        const storageKey = `juz30_account_${userEmail}`;
        let existingAccount = null;
        try {
          existingAccount = JSON.parse(localStorage.getItem(storageKey) || 'null');
        } catch (e) {}

        // Tampilkan Popup Awal Konfirmasi Profil Google (Nama & Foto)
        setGoogleConfirmUser({
          email: userEmail,
          name: existingAccount?.user?.name || payload.name || payload.given_name || "Santri Google",
          avatar: payload.picture || existingAccount?.user?.avatar || "🦁",
          googleId: payload.sub,
          credential: response.credential,
          isExisting: Boolean(existingAccount)
        });
      };

      // Konfirmasi popup awal profil Google untuk masuk ke Dashboard
      const handleConfirmGoogleUser = () => {
        if (!googleConfirmUser || !googleConfirmUser.email) return;

        const userEmail = googleConfirmUser.email.toLowerCase().trim();
        const storageKey = `juz30_account_${userEmail}`;

        let accountData = null;
        try {
          accountData = JSON.parse(localStorage.getItem(storageKey) || 'null');
        } catch (e) {
          accountData = null;
        }

        // Ambil data progres yang tersimpan di akun, ATAU jika belum ada/kosong, wariskan dari local storage
        let savedProgress = accountData?.progress || {};
        let savedHaditsProgress = accountData?.haditsProgress || {};

        if (!accountData || (Object.keys(savedProgress).length === 0 && Object.keys(savedHaditsProgress).length === 0)) {
          try {
            const tempLocalProg = JSON.parse(localStorage.getItem('juz30_local_progress') || '{}');
            if (Object.keys(tempLocalProg).length > 0) savedProgress = tempLocalProg;
            const tempLocalHadits = JSON.parse(localStorage.getItem('juz30_hadits_progress') || '{}');
            if (Object.keys(tempLocalHadits).length > 0) savedHaditsProgress = tempLocalHadits;
          } catch (e) {}
        }

        if (!accountData) {
          accountData = {
            user: {
              name: googleConfirmUser.name || "Santri Google",
              email: userEmail,
              avatar: googleConfirmUser.avatar || "🦁",
              googleId: googleConfirmUser.googleId,
              authProvider: "google",
              createdAt: Date.now()
            },
            progress: savedProgress,
            haditsProgress: savedHaditsProgress
          };
        } else {
          accountData.user = {
            ...accountData.user,
            name: googleConfirmUser.name || accountData.user.name,
            avatar: googleConfirmUser.avatar || accountData.user.avatar,
            googleId: googleConfirmUser.googleId,
            authProvider: "google"
          };
          accountData.progress = savedProgress;
          accountData.haditsProgress = savedHaditsProgress;
        }

        localStorage.setItem(storageKey, JSON.stringify(accountData));
        localStorage.setItem('juz30_current_email', userEmail);
        localStorage.setItem('juz30_google_token', googleConfirmUser.credential);
        localStorage.setItem('juz30_local_progress', JSON.stringify(savedProgress));
        localStorage.setItem('juz30_hadits_progress', JSON.stringify(savedHaditsProgress));

        setGoogleConfirmUser(null);

        onLoginSuccess(
          'google_' + (googleConfirmUser.googleId || Date.now()),
          accountData.user,
          savedProgress,
          savedHaditsProgress
        );
      };

      // Handler kirim link & kata sandi acak reset password
      const handleForgotSubmit = async (e) => {
        e.preventDefault();
        setForgotMsg("");
        const cleanEmail = (forgotEmail || '').toLowerCase().trim();
        if (!cleanEmail) {
          setForgotMsg("Silakan masukkan email akun santri Anda.");
          return;
        }

        setIsSendingForgot(true);
        try {
          let tempPass = "";
          let magicUrl = "";

          if (gasBridge.isGAS) {
            const res = await gasBridge.call('apiForgotPassword', { email: cleanEmail });
            if (res && res.success) {
              tempPass = res.tempPassword || "";
              magicUrl = res.magicLoginUrl || "";
              setGeneratedTempPass(tempPass);
              setGeneratedMagicLink(magicUrl);
              setForgotSent(true);
            } else {
              setForgotMsg(res?.message || "Email tidak ditemukan atau gagal dikirim.");
            }
          } else {
            // Standalone mode / browser PWA mode / Vercel
            const storageKey = `juz30_account_${cleanEmail}`;
            let accountData = null;
            try {
              accountData = JSON.parse(localStorage.getItem(storageKey) || 'null');
            } catch (e) {}

            if (!accountData) {
              setForgotMsg("Email belum terdaftar di aplikasi. Silakan periksa kembali email Anda.");
              setIsSendingForgot(false);
              return;
            }

            // 1. Buat Kata Sandi Acak Sementara (format misal: Juz30-8492)
            const randomCode = Math.floor(1000 + Math.random() * 9000);
            tempPass = `Juz30-${randomCode}`;

    function Dashboard({ userData, progress, haditsProgress = {}, haditsHafalCount = 0, haditsPercentage = 0, onNavigate, onOpenCertificate }) {
      const [showDatePopup, setShowDatePopup] = useState(false);
      const [showAllSurah, setShowAllSurah] = useState(false);
      const [showCompletedModal, setShowCompletedModal] = useState(false);

      const totalAyahs = juz30SurahList.reduce((acc, s) => acc + s.ayahCount, 0);
      const hafalCount = Object.keys(progress).filter(k => {
        const p = progress[k];
        return (p && typeof p === 'object' ? p.status : p) === 'hafal';
      }).length;

      const ulangiList = Object.entries(progress).filter(([k, p]) => {
        return (p && typeof p === 'object' ? p.status : p) === 'ulangi';
      });

      const percentage = Math.min(100, Math.round((hafalCount / totalAyahs) * 100)) || 0;

      const oneWeekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
      const hafalMingguIni = Object.values(progress).filter(p => {
        const status = p && typeof p === 'object' ? p.status : p;
        const ts = p && typeof p === 'object' ? p.timestamp : 0;
        return status === 'hafal' && ts > oneWeekAgo;
      }).length;

      const surahProgress = juz30SurahList.map(surah => {
        let hafal = 0;
        for (let i = 1; i <= surah.ayahCount; i++) {
          if (getAyahStatus(progress, surah.id, i) === 'hafal') hafal++;
        }
        return { ...surah, hafal, percentage: Math.round((hafal / surah.ayahCount) * 100) };
      }).sort((a, b) => b.percentage - a.percentage);

      // 1. Perhitungan Surat Utuh yang Selesai Dihafal (Reward Badge)
      const completedSurahs = useMemo(() => {
        return juz30SurahList.filter(s => {
          for (let i = 1; i <= s.ayahCount; i++) {
            if (getAyahStatus(progress, s.id, i) !== 'hafal') return false;
          }
          return true;
        });
      }, [progress]);

      const completedSurahsCount = completedSurahs.length;
      const completedAyahsCount = completedSurahs.reduce((sum, s) => sum + s.ayahCount, 0);
      const studentName = userData?.name || 'Azka';

      // 2. Perhitungan Surat yang Sedang Berjalan & Belum Tuntas / Baru Dibuka
      const recentSurahsRaw = useMemo(() => {
        try {
          return JSON.parse(localStorage.getItem('juz30_recent_surahs') || '[]');
        } catch {
          return [];
        }
      }, []);

      const unfinishedSurahs = useMemo(() => {
        return juz30SurahList.map(s => {
          let hafal = 0;
          let firstUnmemorized = 1;
          let foundUnmemorized = false;
          let hasRecentActivity = false;

          for (let i = 1; i <= s.ayahCount; i++) {
            const raw = progress[`${s.id}_${i}`];
            const st = raw && typeof raw === 'object' ? raw.status : raw;
            const ts = raw && typeof raw === 'object' ? raw.timestamp : 0;

            if (st === 'hafal') {
              hafal++;
            } else if (!foundUnmemorized) {
              firstUnmemorized = i;
              foundUnmemorized = true;
            }

            if (ts && ts > oneWeekAgo) {
              hasRecentActivity = true;
            }
          }

          return {
            ...s,
            hafal,
            firstUnmemorized,
            percentage: Math.round((hafal / s.ayahCount) * 100),
            isComplete: hafal === s.ayahCount,
            hasStarted: hafal > 0,
            hasRecentActivity
          };
        }).filter(s => (s.hasStarted || s.hasRecentActivity) && !s.isComplete);
      }, [progress, oneWeekAgo]);

      const recentOpenedList = useMemo(() => {
        return recentSurahsRaw.map(r => {
          const s = juz30SurahList.find(item => item.id == r.id);
          if (!s) return null;
          let hafal = 0;
          let firstUnmemorized = 1;
          let foundUnmemorized = false;
          for (let i = 1; i <= s.ayahCount; i++) {
            const st = getAyahStatus(progress, s.id, i);
            if (st === 'hafal') hafal++;
            else if (!foundUnmemorized) {
              firstUnmemorized = i;
              foundUnmemorized = true;
            }
          }
          return {
            ...s,
            hafal,
            firstUnmemorized,
            percentage: Math.round((hafal / s.ayahCount) * 100),
            isComplete: hafal === s.ayahCount
          };
        }).filter(Boolean);
      }, [recentSurahsRaw, progress]);

      const dayNames = ['Ahad', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const weekDays = useMemo(() => {
        const days = [];
        const curr = new Date();
        const first = curr.getDate() - curr.getDay();
        for (let i = 0; i < 7; i++) {
          const d = new Date(curr.getFullYear(), curr.getMonth(), first + i);
          const startOfDay = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
          const endOfDay = startOfDay + 24 * 60 * 60 * 1000 - 1;

          const ayahsToday = Object.entries(progress).filter(([key, p]) => {
            const status = p && typeof p === 'object' ? p.status : p;
            const ts = p && typeof p === 'object' ? p.timestamp : 0;
            return status === 'hafal' && ts >= startOfDay && ts <= endOfDay;
          });

          const grouped = {};
          ayahsToday.forEach(([key]) => {
            const [sId, aNum] = key.split('_');
            if (!grouped[sId]) grouped[sId] = [];
            grouped[sId].push(parseInt(aNum));
          });

          let summary = 'Belum ada';
          if (ayahsToday.length > 0) {
            summary = Object.keys(grouped).map(sId => {
              const sName = juz30SurahList.find(s => s.id == sId)?.name;
              const min = Math.min(...grouped[sId]);
              const max = Math.max(...grouped[sId]);
              return min === max ? `${sName} (Ay. ${min})` : `${sName} (Ay. ${min}-${max})`;
            }).join(', ');
          }

          days.push({
            name: dayNames[i],
            dateStr: d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }),
            summary,
            hasData: ayahsToday.length > 0,
            isToday: d.toDateString() === curr.toDateString()
          });
        }
        return days;
      }, [progress]);

      return (
        <div className="space-y-6 pb-12 max-w-5xl mx-auto">
          {/* Welcome Card Generasi Cerdas dengan Brand Icon */}
          <div className="bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-700 text-white p-5 md:p-6 rounded-3xl shadow-md border-2 border-emerald-500/50 flex flex-col sm:flex-row items-center justify-between gap-4 relative overflow-hidden">
            <div className="absolute -right-10 -bottom-10 w-44 h-44 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
            <div className="flex items-center gap-4 relative z-10 w-full sm:w-auto">
              <img 
                src="app-icon.jpg" 
                alt="Generasi Cerdas Metode Ummi" 
                className="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl object-cover shadow-xl border-2 border-amber-300 shrink-0" 
              />
              <div>
                <div className="inline-flex items-center gap-1.5 bg-emerald-950/30 backdrop-blur-xs px-2.5 py-0.5 rounded-full text-[10px] sm:text-xs font-black text-amber-200 mb-1 border border-emerald-400/30">
                  <span>⭐ Generasi Cerdas • Metode Ummi</span>
                </div>
                <h2 className="text-lg sm:text-2xl font-black tracking-tight leading-tight">
                  Hafalan Juz 30 & Hadits Arba'in
                </h2>
                <p className="text-xs sm:text-sm text-emerald-100 font-semibold mt-0.5">
                  Selamat belajar, <span className="text-amber-200 font-black">{studentName}</span>! Semangat istiqamah menghafal Al-Qur'an dan Hadits.
                </p>
              </div>
            </div>
            <div className="flex items-center gap-2 w-full sm:w-auto justify-end shrink-0 relative z-10">
              <button
                type="button"
                onClick={onOpenCertificate}
                className="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-amber-400 hover:bg-amber-300 active:scale-95 text-amber-950 text-xs sm:text-sm font-black rounded-2xl transition shadow-md border border-amber-200 cursor-pointer"
              >
                <Icon name="award" size={17} />
                <span>Cek Sertifikat 🎓</span>
              </button>
            </div>
          </div>

          {/* Badge Pencapaian Pejuang Cilik 🏅 */}
          <div className="bg-gradient-to-br from-amber-400 via-amber-300 to-yellow-400 text-amber-950 p-5 md:p-6 rounded-3xl shadow-md border-2 border-yellow-300 relative overflow-hidden">
            <div className="flex flex-col sm:flex-row items-start sm:items-center gap-4 relative z-10">
              <div className="w-16 h-16 bg-white/95 rounded-2xl flex items-center justify-center text-4xl shadow-md shrink-0 border-2 border-amber-200">
                🏅
              </div>
              <div className="flex-1">
                <div className="inline-flex items-center gap-1.5 bg-amber-950/15 backdrop-blur-xs px-3 py-1 rounded-full text-xs font-black text-amber-950 mb-1.5">
                  <span>Pencapaian Pejuang Cilik 🏅</span>
                </div>
                <p className="font-extrabold text-sm md:text-base leading-relaxed text-amber-950">
                  {completedSurahsCount > 0
                    ? `Alhamdulillah ${studentName} sudah menghafal ${completedSurahsCount} surat penuh (${completedAyahsCount} ayat). Semoga Allah permudah untuk menyelesaikan hafalan juz 30! 🌟`
                    : `Alhamdulillah ${studentName} telah mulai menghafal ${hafalCount} ayat. Ayo selesaikan surat penuh pertamamu! Semoga Allah permudah untuk menyelesaikan hafalan juz 30! 🌟`
                  }
                </p>
                <div className="mt-3 pt-2.5 border-t border-amber-950/15 flex flex-wrap items-center justify-between gap-2">
                  {completedSurahsCount > 0 && (
                    <button
                      type="button"
                      onClick={() => setShowCompletedModal(true)}
                      className="inline-flex items-center gap-2 px-4 py-2 bg-amber-950/15 hover:bg-amber-950/25 active:scale-95 text-amber-950 text-xs font-black rounded-2xl transition shadow-2xs border border-amber-950/20"
                    >
                      <span>Lihat Surat yang Telah Dihafal ({completedSurahsCount} Surat) 🏆</span>
                      <Icon name="chevronRight" size={16} />
                    </button>
                  )}
                  <button
                    type="button"
                    onClick={onOpenCertificate}
                    className="inline-flex items-center gap-2 px-4 py-2 bg-emerald-800 hover:bg-emerald-900 active:scale-95 text-white text-xs font-black rounded-2xl transition shadow-md border border-emerald-700 cursor-pointer ml-auto"
                  >
                    <Icon name="award" size={16} />
                    <span>Cek Sertifikat Kelulusan 🎓</span>
                  </button>
                </div>
              </div>
            </div>
          </div>

          {/* Grid responsive untuk Ringkasan Target */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            {/* 1. Target Al-Qur'an */}
            <div className="bg-white rounded-3xl p-5 shadow-sm border-2 border-emerald-100 text-center flex flex-col items-center justify-center">
              <h3 className="font-extrabold text-slate-500 text-xs mb-1">Target Juz 30 (Al-Qur'an)</h3>
              <div className="relative w-20 h-20 my-2">
                <svg className="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                  <path className="text-slate-100" strokeWidth="4" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                  <path className="text-emerald-500 transition-all duration-700" strokeDasharray={`${percentage}, 100`} strokeWidth="4" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" strokeLinecap="round" />
                </svg>
                <div className="absolute inset-0 flex items-center justify-center flex-col">
                  <span className="text-base font-black text-emerald-600">{percentage}%</span>
                </div>
              </div>
              <p className="text-xs font-bold text-slate-600">{hafalCount} / {totalAyahs} Ayat</p>
            </div>

            {/* 2. Target Hadits Arbain */}
            <div className="bg-white rounded-3xl p-5 shadow-sm border-2 border-sky-100 text-center flex flex-col items-center justify-center">
              <h3 className="font-extrabold text-slate-500 text-xs mb-1">Target Hadits Arbain</h3>
              <div className="relative w-20 h-20 my-2">
                <svg className="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                  <path className="text-slate-100" strokeWidth="4" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                  <path className="text-sky-500 transition-all duration-700" strokeDasharray={`${haditsPercentage}, 100`} strokeWidth="4" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" strokeLinecap="round" />
                </svg>
                <div className="absolute inset-0 flex items-center justify-center flex-col">
                  <span className="text-base font-black text-sky-600">{haditsPercentage}%</span>
                </div>
              </div>
              <p className="text-xs font-bold text-slate-600">{haditsHafalCount} / 50 Hadits</p>
            </div>

            {/* 3. Minggu Ini */}
            <div className="bg-white rounded-3xl p-5 shadow-sm border-2 border-amber-100 text-center flex flex-col items-center justify-center">
              <h3 className="font-extrabold text-slate-500 text-xs mb-1">Pekan Ini</h3>
              <div className="text-4xl font-black text-amber-500 my-3">{hafalMingguIni}</div>
              <p className="text-xs font-bold text-slate-600">Ayat Baru Dihafal 📈</p>
            </div>
          </div>

          {/* Tombol Aksi Utama: Mulai Hafalan | Hadits Arbain | Kisah & Makna */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <Button3D colorClass="green" className="h-full flex-col space-y-2 p-5" onClick={() => setShowDatePopup(true)}>
              <Icon name="bookOpen" size={34} className="text-emerald-100" />
              <span className="text-sm font-extrabold">Mulai Hafalan 🚀</span>
            </Button3D>
            <Button3D colorClass="blue" className="h-full flex-col space-y-2 p-5" onClick={() => onNavigate('haditsList')}>
              <div className="text-3xl text-sky-100">📜</div>
              <span className="text-sm font-extrabold">Hadits Arbain 📜</span>
              <span className="text-[10px] bg-sky-700/60 px-2 py-0.5 rounded-full font-bold">50 Hadits Pilihan</span>
            </Button3D>
            <Button3D colorClass="purple" className="h-full flex-col space-y-2 p-5" onClick={() => onNavigate('maknaList')}>
              <Icon name="sparkles" size={34} className="text-violet-100" />
              <span className="text-sm font-extrabold">Kisah & Makna ✨</span>
            </Button3D>
          </div>

          {/* Notifikasi Di Bawah Persentase Mingguan: Surat Belum Tuntas & Baru Dibuka */}
          <div className="bg-gradient-to-r from-sky-50 via-teal-50 to-emerald-50 border-2 border-sky-200 p-5 rounded-3xl shadow-sm">
            <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div className="flex items-center space-x-2.5 text-sky-900">
                <span className="text-2xl">🔔</span>
                <div>
                  <h3 className="font-black text-sm md:text-base">Pengingat Hafalan Pekan Ini</h3>
                  <p className="text-[11px] font-bold text-sky-700">Surat yang belum tuntas minggu ini atau baru saja dibuka</p>
                </div>
              </div>
              {unfinishedSurahs.length > 0 && (
                <span className="text-xs font-black bg-sky-200/90 text-sky-900 px-3 py-1 rounded-full border border-sky-300">
                  {unfinishedSurahs.length} Surat Belum Tuntas
                </span>
              )}
            </div>

            {unfinishedSurahs.length > 0 ? (
              <div className="space-y-3">
                <p className="text-xs text-slate-600 font-semibold">
                  Yuk lanjutkan dan tuntaskan sisa hafalan surat yang sedang berjalan di bawah ini:
                </p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {unfinishedSurahs.slice(0, 4).map(s => (
                    <div key={s.id} className="bg-white p-4 rounded-2xl border border-sky-100 shadow-2xs flex flex-col justify-between">
                      <div className="flex items-center justify-between mb-2">
                        <div className="flex items-center gap-2.5">
                          <span className="w-8 h-8 bg-sky-100 text-sky-800 rounded-xl flex items-center justify-center font-black text-xs border border-sky-200">
                            {s.id}
                          </span>
                          <div>
                            <h4 className="font-black text-xs text-slate-800">Surat {s.name}</h4>
                            <span className="text-[10px] text-slate-400 font-semibold">{s.meaning}</span>
                          </div>
                        </div>
                        <span className="font-black text-xs text-sky-700 bg-sky-50 px-2.5 py-1 rounded-full border border-sky-200">
                          {s.hafal} / {s.ayahCount} Ayat ({s.percentage}%)
                        </span>
                      </div>
                      
                      <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden mb-3">
                        <div className="bg-sky-500 h-full rounded-full transition-all" style={{ width: `${s.percentage}%` }}></div>
                      </div>

                      <div className="flex items-center justify-between pt-1">
                        <span className="text-[11px] text-amber-700 font-extrabold bg-amber-50 px-2 py-0.5 rounded-md border border-amber-200">
                          Kurang {s.ayahCount - s.hafal} ayat lagi
                        </span>
                        <button
                          onClick={() => onNavigate('surahDetail', s.id.toString(), s.firstUnmemorized, s.ayahCount)}
                          className="px-3.5 py-1.5 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white rounded-xl text-xs font-black transition flex items-center gap-1 shadow-2xs"
                        >
                          <span>Lanjut (Ay. {s.firstUnmemorized}) 🚀</span>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ) : recentOpenedList.length > 0 ? (
              <div className="space-y-2">
                <p className="text-xs text-slate-600 font-semibold">
                  Surat yang baru-baru ini dibuka:
                </p>
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5">
                  {recentOpenedList.slice(0, 3).map(s => (
                    <div key={s.id} className="bg-white p-3 rounded-2xl border border-sky-100 shadow-2xs flex items-center justify-between">
                      <div>
                        <div className="font-black text-xs text-slate-800">Surat {s.name}</div>
                        <div className="text-[10px] text-slate-400 font-semibold">{s.hafal} / {s.ayahCount} ayat dihafal</div>
                      </div>
                      <button
                        onClick={() => onNavigate('surahDetail', s.id.toString())}
                        className="px-3 py-1 bg-sky-50 hover:bg-sky-100 text-sky-800 font-black text-xs rounded-xl border border-sky-200 transition"
                      >
                        Buka ➔
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            ) : (
              <div className="bg-white/80 p-4 rounded-2xl border border-sky-100 text-center">
                <p className="text-xs text-slate-600 font-semibold">
                  ✨ Masya Allah, semua surat yang dibuka sudah tuntas dihafal! Pilih surat baru untuk terus menambah hafalan Juz 30.
                </p>
                <button
                  onClick={() => onNavigate('surahList')}
                  className="mt-2.5 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-black transition inline-flex items-center gap-1.5 shadow-sm"
                >
                  <span>Pilih Surat Baru 📖</span>
                </button>
              </div>
            )}
          </div>

          {ulangiList.length > 0 && (
            <div className="bg-amber-50 border-2 border-amber-300 p-4 rounded-3xl shadow-sm">
              <div className="flex items-center space-x-2 mb-2 text-amber-800">
                <Icon name="alertCircle" size={18} />
                <h3 className="font-extrabold text-sm">Perlu Dimuraja'ah (Diulang)! 🔄</h3>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                {ulangiList.slice(0, 3).map(([key]) => {
                  const [surahId, ayahNum] = key.split('_');
                  const s = juz30SurahList.find(item => item.id == surahId);
                  return (
                    <button 
                      key={key} 
                      onClick={() => onNavigate('surahDetail', surahId, parseInt(ayahNum), parseInt(ayahNum))}
                      className="text-left bg-white/90 hover:bg-white p-2.5 rounded-xl text-xs font-bold text-amber-900 border border-amber-200 flex justify-between items-center transition"
                    >
                      <span>Surat {s?.name} : Ayat {ayahNum}</span>
                      <span className="text-[10px] bg-amber-200 px-2 py-0.5 rounded-md">Ulang</span>
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 space-y-3">
              <div className="flex items-center justify-between ml-1">
                <h3 className="font-extrabold text-slate-700 text-xs uppercase tracking-wider">Progres Tiap Surat (Juz 30)</h3>
                <span className="text-[11px] font-bold text-slate-400">
                  {showAllSurah ? `Semua (${surahProgress.length} Surat)` : `Menampilkan ${Math.min(8, surahProgress.length)} dari ${surahProgress.length}`}
                </span>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                {(showAllSurah ? surahProgress : surahProgress.slice(0, 8)).map(s => (
                  <div 
                    key={s.id} 
                    onClick={() => onNavigate('surahDetail', s.id.toString())} 
                    className="bg-white p-4 rounded-3xl shadow-sm border-2 border-emerald-100/80 hover:border-emerald-300 cursor-pointer active:scale-95 transition text-center flex flex-col justify-between"
                  >
                    <div>
                      <div className="w-8 h-8 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto mb-2 text-xs font-black">
                        {s.id}
                      </div>
                      <div className="font-extrabold text-slate-800 text-xs truncate mb-0.5">{s.name}</div>
                      <div className="text-[10px] text-slate-400 font-semibold mb-2">{s.hafal} / {s.ayahCount} ayat</div>
                    </div>
                    <div>
                      <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div className="bg-emerald-500 h-full rounded-full transition-all" style={{ width: `${s.percentage}%` }}></div>
                      </div>
                      <span className="text-[10px] font-black text-emerald-600 mt-1 inline-block">{s.percentage}%</span>
                    </div>
                  </div>
                ))}
              </div>

              <div className="text-center pt-2">
                <button
                  type="button"
                  onClick={() => setShowAllSurah(!showAllSurah)}
                  className="inline-flex items-center gap-2 px-5 py-2.5 bg-emerald-100/90 hover:bg-emerald-200 text-emerald-800 text-xs font-black rounded-2xl active:scale-95 transition border border-emerald-200 shadow-2xs"
                >
                  <span>{showAllSurah ? 'Tampilkan Lebih Sedikit ▴' : `Lihat Selengkapnya (${surahProgress.length} Surat) ▾`}</span>
                </button>
              </div>
            </div>

            <div className="bg-white rounded-3xl p-5 shadow-sm border-2 border-sky-100 h-fit">
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center space-x-2">
                  <Icon name="calendar" size={18} className="text-sky-500" />
                  <h3 className="font-extrabold text-slate-800 text-sm">Catatan Mingguan</h3>
                </div>
                <button 
                  onClick={() => onNavigate('laporan')}
                  className="text-[11px] font-black text-sky-600 hover:text-sky-700 hover:underline"
                >
                  Detail ↗
                </button>
              </div>
              <div className="space-y-2">
                {weekDays.map((d, i) => (
                  <div key={i} className={`flex items-center justify-between p-2.5 rounded-2xl border text-xs ${d.isToday ? 'bg-sky-50 border-sky-300' : 'bg-slate-50/70 border-slate-100'}`}>

                      <span className={`font-black ${d.isToday ? 'text-sky-700' : 'text-slate-700'}`}>{d.name}</span>

                    >
                      <div className="flex items-center gap-3">

          {showDatePopup && (

    function LaporanMingguan({ userData, progress, onNavigate }) {
      const totalAyahs = juz30SurahList.reduce((acc, s) => acc + s.ayahCount, 0);
      const hafalCount = Object.keys(progress).filter(k => {
        const p = progress[k];
        return (p && typeof p === 'object' ? p.status : p) === 'hafal';
      }).length;

      const ulangiList = Object.entries(progress).filter(([k, p]) => {
        return (p && typeof p === 'object' ? p.status : p) === 'ulangi';
      });

      const percentage = Math.min(100, Math.round((hafalCount / totalAyahs) * 100)) || 0;

      const oneWeekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
      const hafalMingguIni = Object.values(progress).filter(p => {
        const status = p && typeof p === 'object' ? p.status : p;
        const ts = p && typeof p === 'object' ? p.timestamp : 0;
        return status === 'hafal' && ts > oneWeekAgo;
      }).length;

      const dayNames = ['Ahad', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const weekDays = useMemo(() => {
        const days = [];
        const curr = new Date();
        const first = curr.getDate() - curr.getDay();
        for (let i = 0; i < 7; i++) {
          const d = new Date(curr.getFullYear(), curr.getMonth(), first + i);
          const startOfDay = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
          const endOfDay = startOfDay + 24 * 60 * 60 * 1000 - 1;

          const ayahsToday = Object.entries(progress).filter(([key, p]) => {
            const status = p && typeof p === 'object' ? p.status : p;
            const ts = p && typeof p === 'object' ? p.timestamp : 0;
            return status === 'hafal' && ts >= startOfDay && ts <= endOfDay;
          });

          const grouped = {};
          ayahsToday.forEach(([key]) => {
            const [sId, aNum] = key.split('_');
            if (!grouped[sId]) grouped[sId] = [];
            grouped[sId].push(parseInt(aNum));
          });

          const items = Object.keys(grouped).map(sId => {
            const sName = juz30SurahList.find(s => s.id == sId)?.name;
            const min = Math.min(...grouped[sId]);
            const max = Math.max(...grouped[sId]);
            return {
              surahId: sId,
              name: sName,
              min,
              max,
              count: grouped[sId].length,
              label: min === max ? `${sName} (Ay. ${min})` : `${sName} (Ay. ${min}-${max})`
            };
          });

          days.push({
            name: dayNames[i],
            dateStr: d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }),
            shortDate: d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }),
            items,
            ayahCount: ayahsToday.length,
            hasData: ayahsToday.length > 0,
            isToday: d.toDateString() === curr.toDateString()
          });
        }
        return days;
      }, [progress]);

      const activeDaysCount = weekDays.filter(d => d.hasData).length;

      const unfinishedSurahs = useMemo(() => {
        return juz30SurahList.map(s => {
          let hafal = 0;
          let firstUnmemorized = 1;
          let foundUnmemorized = false;
          let hasRecentActivity = false;

          for (let i = 1; i <= s.ayahCount; i++) {
            const raw = progress[`${s.id}_${i}`];
            const st = raw && typeof raw === 'object' ? raw.status : raw;
            const ts = raw && typeof raw === 'object' ? raw.timestamp : 0;

            if (st === 'hafal') {
              hafal++;
            } else if (!foundUnmemorized) {
              firstUnmemorized = i;
              foundUnmemorized = true;
            }

            if (ts && ts > oneWeekAgo) {
              hasRecentActivity = true;
            }
          }

          return {
            ...s,
            hafal,
            firstUnmemorized,
            percentage: Math.round((hafal / s.ayahCount) * 100),
            isComplete: hafal === s.ayahCount,
            hasStarted: hafal > 0,
            hasRecentActivity
          };
        }).filter(s => (s.hasStarted || s.hasRecentActivity) && !s.isComplete);
      }, [progress, oneWeekAgo]);

      return (
        <div className="space-y-6 pb-12 max-w-5xl mx-auto">
          {/* Header Banner Laporan */}
          <div className="bg-gradient-to-r from-sky-500 via-teal-500 to-emerald-600 text-white p-6 rounded-3xl shadow-md relative overflow-hidden">
            <div className="relative z-10">
              <div className="inline-flex items-center gap-2 bg-white/20 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-black mb-2 text-white">
                <Icon name="calendar" size={14} />
                <span>Laporan Perkembangan Mingguan</span>
              </div>
              <h2 className="text-xl md:text-2xl font-black">Evaluasi Hafalan Santri 📊</h2>
              <p className="text-xs md:text-sm text-sky-100 font-medium mt-1 max-w-xl">
                Rekap catatan hafalan selama sepekan untuk santri <b>{userData?.name || 'Sahabat Cilik'}</b>.
              </p>
            </div>
            <div className="absolute right-4 bottom-2 text-6xl opacity-20 select-none pointer-events-none">
              📈
            </div>
          </div>

          {/* Metric Ringkasan */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
            <div className="bg-white p-4 rounded-3xl border-2 border-emerald-100 shadow-sm text-center">
              <span className="text-[11px] font-black text-slate-400 uppercase tracking-wider">Hafalan Pekan Ini</span>
              <div className="text-3xl font-black text-emerald-600 my-1">+{hafalMingguIni}</div>
              <span className="text-[11px] font-bold text-slate-500">Ayat Baru Selesai</span>
            </div>

            <div className="bg-white p-4 rounded-3xl border-2 border-sky-100 shadow-sm text-center">
              <span className="text-[11px] font-black text-slate-400 uppercase tracking-wider">Hari Aktif</span>
              <div className="text-3xl font-black text-sky-500 my-1">{activeDaysCount} <span className="text-sm text-slate-400 font-bold">/ 7</span></div>
              <span className="text-[11px] font-bold text-slate-500">Hari Menghafal</span>
            </div>

            <div className="bg-white p-4 rounded-3xl border-2 border-purple-100 shadow-sm text-center">
              <span className="text-[11px] font-black text-slate-400 uppercase tracking-wider">Total Juz 30</span>
              <div className="text-3xl font-black text-purple-600 my-1">{percentage}%</div>
              <span className="text-[11px] font-bold text-slate-500">{hafalCount} / {totalAyahs} Ayat</span>
            </div>

            <div className="bg-white p-4 rounded-3xl border-2 border-amber-100 shadow-sm text-center">
              <span className="text-[11px] font-black text-slate-400 uppercase tracking-wider">Perlu Muraja'ah</span>
              <div className="text-3xl font-black text-amber-500 my-1">{ulangiList.length}</div>
              <span className="text-[11px] font-bold text-slate-500">Ayat Belum Lancar</span>
            </div>
          </div>

          {/* Notifikasi Surat Belum Tuntas Di Bawah Persentase Mingguan */}
          {unfinishedSurahs.length > 0 && (
            <div className="bg-gradient-to-r from-sky-50 via-teal-50 to-emerald-50 border-2 border-sky-200 p-5 rounded-3xl shadow-sm">
              <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                <div className="flex items-center space-x-2 text-sky-900">
                  <span className="text-xl">🔔</span>
                  <div>
                    <h3 className="font-black text-sm md:text-base">Surat Belum Tuntas Pekan Ini</h3>
                    <p className="text-[11px] font-bold text-sky-700">Daftar hafalan surat yang sedang berjalan pekan ini dan perlu dituntaskan</p>
                  </div>
                </div>
                <span className="text-xs font-black bg-sky-200/90 text-sky-900 px-3 py-1 rounded-full border border-sky-300">
                  {unfinishedSurahs.length} Surat Berjalan
                </span>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                {unfinishedSurahs.map(s => (
                  <div key={s.id} className="bg-white p-4 rounded-2xl border border-sky-100 shadow-2xs flex flex-col justify-between">
                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <span className="font-black text-xs text-slate-800">Surat {s.name}</span>
                        <span className="text-[10px] font-black text-sky-700 bg-sky-50 px-2 py-0.5 rounded-full border border-sky-200">
                          {s.percentage}%
                        </span>
                      </div>
                      <div className="text-[10px] text-slate-400 font-semibold mb-2">
                        {s.hafal} / {s.ayahCount} ayat (Sisa {s.ayahCount - s.hafal} ayat lagi)
                      </div>
                      <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden mb-3">
                        <div className="bg-sky-500 h-full rounded-full transition-all" style={{ width: `${s.percentage}%` }}></div>
                      </div>
                    </div>
                    <button
                      onClick={() => onNavigate('surahDetail', s.id.toString(), s.firstUnmemorized, s.ayahCount)}
                      className="w-full py-2 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white rounded-xl text-xs font-black transition flex items-center justify-center gap-1 shadow-2xs"
                    >
                      <span>Lanjutkan Hafalan ➔</span>
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Rincian Aktivitas Hari per Hari */}
          <div className="bg-white rounded-3xl p-5 md:p-6 shadow-sm border-2 border-slate-100">
            <div className="flex items-center justify-between mb-4">
              <div className="flex items-center space-x-2">
                <Icon name="calendar" size={20} className="text-emerald-600" />
                <h3 className="font-black text-slate-800 text-base">Rincian Belajar Sepekan (Ahad - Sabtu)</h3>
              </div>
              <span className="text-xs font-bold text-slate-400">Pekan Berjalan</span>
            </div>

            <div className="space-y-3">
              {weekDays.map((d, i) => (
                <div 
                  key={i} 
                  className={`p-4 rounded-2xl border transition-all ${
                    d.isToday 
                      ? 'bg-sky-50/70 border-sky-300 ring-2 ring-sky-200' 
                      : d.hasData 
                        ? 'bg-emerald-50/40 border-emerald-200' 
                        : 'bg-slate-50/60 border-slate-100'
                  }`}
                >
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                    <div className="flex items-center gap-2">
                      <span className={`font-black text-sm ${d.isToday ? 'text-sky-800' : 'text-slate-800'}`}>
                        {d.name}
                      </span>
                      <span className="text-xs font-bold text-slate-400 bg-white px-2 py-0.5 rounded-lg border border-slate-200">
                        {d.shortDate}
                      </span>
                      {d.isToday && (
                        <span className="text-[10px] font-black bg-sky-500 text-white px-2 py-0.5 rounded-full">
                          Hari Ini
                        </span>
                      )}
                    </div>

                    <div>
                      {d.hasData ? (
                        <span className="text-xs font-black text-emerald-800 bg-emerald-100 px-3 py-1 rounded-full inline-flex items-center gap-1">
                          <Icon name="checkCircle" size={14} />
                          {d.ayahCount} Ayat Dihafal
                        </span>
                      ) : (
                        <span className="text-xs font-semibold text-slate-400 italic">
                          Belum ada catatan
                        </span>
                      )}
                    </div>
                  </div>

                  {d.hasData ? (
                    <div className="flex flex-wrap gap-2 mt-2">
                      {d.items.map((item, idx) => (
                        <button
                          key={idx}
                          onClick={() => onNavigate('surahDetail', item.surahId, item.min, item.max)}
                          className="bg-white hover:bg-emerald-100/50 border border-emerald-200 px-3 py-1.5 rounded-xl text-xs font-bold text-emerald-900 transition flex items-center gap-1.5 shadow-2xs"
                        >
                          <span>📖 {item.label}</span>
                          <span className="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 py-0.2 rounded font-black">
                            {item.count} ay.
                          </span>
                        </button>
                      ))}
                    </div>
                  ) : (
                    <p className="text-xs text-slate-400 font-medium">Santri belum menambah hafalan pada hari ini.</p>
                  )}
                </div>
              ))}
            </div>
          </div>

          {/* Bagian Perlu Dimuraja'ah */}
          {ulangiList.length > 0 && (
            <div className="bg-amber-50 border-2 border-amber-300 p-5 rounded-3xl shadow-sm">
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center space-x-2 text-amber-800">
                  <Icon name="alertCircle" size={20} />
                  <h3 className="font-black text-sm md:text-base">Daftar Muraja'ah Pekan Ini 🔄</h3>
                </div>
                <span className="text-xs font-black bg-amber-200 text-amber-900 px-2.5 py-0.5 rounded-full">
                  {ulangiList.length} Ayat Perlu Diulang
                </span>
              </div>
              <p className="text-xs text-amber-800 font-medium mb-3">
                Ayat-ayat berikut ditandai "Perlu Diulang". Klik ayat untuk langsung membuka dan melancarkannya kembali:
              </p>
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5">
                {ulangiList.map(([key]) => {
                  const [surahId, ayahNum] = key.split('_');
                  const s = juz30SurahList.find(item => item.id == surahId);
                  return (
                    <button 
                      key={key} 
                      onClick={() => onNavigate('surahDetail', surahId, parseInt(ayahNum), parseInt(ayahNum))}
                      className="text-left bg-white hover:bg-amber-100/60 p-3 rounded-2xl text-xs font-bold text-amber-950 border border-amber-200 flex justify-between items-center transition shadow-2xs group"
                    >
                      <div>
                        <div className="font-black text-slate-800">Surat {s?.name}</div>
                        <div className="text-[11px] text-amber-700 font-semibold">Ayat {ayahNum}</div>
                      </div>
                      <span className="text-[10px] bg-amber-200 group-hover:bg-amber-300 text-amber-900 px-2 py-1 rounded-lg font-black transition">
                        Latih ↺
                      </span>
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {/* Kotak Motivasi & Apresiasi */}
          <div className="bg-gradient-to-br from-amber-100 to-amber-50 border-2 border-amber-200 rounded-3xl p-5 md:p-6 text-center shadow-sm">
            <div className="text-3xl mb-2">⭐ ⭐ ⭐ ⭐ ⭐</div>
            <h4 className="font-black text-amber-900 text-base">Masya Allah, Tetap Semangat Pejuang Qur'an!</h4>
            <p className="text-xs md:text-sm text-amber-800 font-medium max-w-lg mx-auto mt-1 leading-relaxed">
              "Siapa yang membaca satu huruf dari Kitabullah, maka baginya satu kebaikan, dan satu kebaikan dilipatgandakan menjadi sepuluh kebaikan." (HR. Tirmidzi)
            </p>
            <div className="mt-4 flex flex-wrap justify-center gap-3">
              <Button3D colorClass="green" className="py-2.5 px-6 text-xs" onClick={() => onNavigate('surahList')}>
                Mulai Hafalan Baru 🚀
              </Button3D>
              <Button3D colorClass="white" className="py-2.5 px-5 text-xs" onClick={() => onNavigate('dashboard')}>
                Kembali ke Beranda 🏠
              </Button3D>
            </div>
          </div>
        </div>
      );
    }

    function SurahList({ onSelect, progress, mode = 'hafalan' }) {
      const [search, setSearch] = useState("");
      const [targetModal, setTargetModal] = useState(null);
      const [startAyah, setStartAyah] = useState(1);
      const [endAyah, setEndAyah] = useState(5);

      const isReading = mode === 'reading';

      const filtered = juz30SurahList.filter(s => 
        s.name.toLowerCase().includes(search.toLowerCase()) || 
        s.meaning.toLowerCase().includes(search.toLowerCase())
      );

      const getProgressPercent = (surahId, total) => {
        let count = 0;
        for (let i = 1; i <= total; i++) {
          if (getAyahStatus(progress, surahId, i) === 'hafal') count++;
        }
        return Math.round((count / total) * 100);
      };

      const handleSurahClick = (surah) => {
        if (isReading) {
          // Mode Membaca: LANGSUNG buka surat dengan ayat utuh (1 s.d. ayahCount) tanpa popup!
          onSelect(surah.id.toString(), 1, surah.ayahCount);
        } else {
          // Mode Hafalan: Tampilkan modal pilih rentang target ayat
          setTargetModal(surah);
          setStartAyah(1);
          setEndAyah(Math.min(5, surah.ayahCount));
        }
      };

      return (
        <div className="space-y-4 pb-10 max-w-5xl mx-auto">
          {/* Header Penjelas Mode */}
          <div className={`p-4 rounded-3xl text-white shadow-md flex items-center justify-between ${isReading ? 'bg-gradient-to-r from-teal-500 to-emerald-600' : 'bg-gradient-to-r from-emerald-600 to-green-600'}`}>
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 bg-white/20 rounded-2xl flex items-center justify-center text-xl shadow-inner">
                {isReading ? '📖' : '🎯'}
              </div>
              <div>
                <h2 className="font-black text-sm md:text-base">
                  {isReading ? 'Membaca Al-Qur\'an Juz 30' : 'Target Hafalan Surat'}
                </h2>
                <p className="text-[11px] text-emerald-100 font-semibold">
                  {isReading ? 'Pilih surat untuk langsung membaca seluruh ayat secara utuh' : 'Tentukan rentang ayat untuk fokus dihafal hari ini'}
                </p>
              </div>
            </div>
            <span className="text-[10px] font-black bg-white/20 px-3 py-1 rounded-full uppercase tracking-wider hidden sm:inline">
              {isReading ? 'Mode Membaca' : 'Mode Hafalan'}
            </span>
          </div>

          <div className="relative max-w-md mx-auto">
            <div className="absolute left-3.5 top-3.5 text-slate-400"><Icon name="search" size={18} /></div>
            <input 
              type="text" 
              placeholder="Cari surat di Juz 30..." 
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              className="w-full bg-white border-2 border-emerald-100 p-3 pl-10 rounded-2xl font-bold text-sm text-slate-700 outline-none focus:border-emerald-400 shadow-sm"
            />
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
            {filtered.map(surah => {
              const prog = getProgressPercent(surah.id, surah.ayahCount);
              return (
                <div
